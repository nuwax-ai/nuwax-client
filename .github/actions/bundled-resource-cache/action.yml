name: Share bundled resource downloads
description: Immutable download archives reusable across release refs with verified producer provenance
inputs:
  arch:
    description: Target architecture
    required: true
  operation:
    description: restore before preparation, save after successful preparation
    required: false
    default: restore
runs:
  using: composite
  steps:
    - name: Resolve bundled download recipe
      id: identity
      continue-on-error: true
      shell: bash
      env:
        TARGET_ARCH: ${{ inputs.arch }}
      run: node scripts/client/build-resource-artifacts.mjs bundled-key
    - name: Share fixed download archives
      if: steps.identity.outputs.key != ''
      uses: ./.github/actions/build-resource-artifact
      with:
        operation: ${{ inputs.operation }}
        kind: bundled
        key: ${{ steps.identity.outputs.key }}
        arch: ${{ inputs.arch }}
    - name: Report unavailable cache identity
      if: steps.identity.outcome != 'success'
      shell: bash
      run: echo 'Bundled download cache identity unavailable; original downloads remain enabled.' >> "$GITHUB_STEP_SUMMARY"
