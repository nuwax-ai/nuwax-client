name: Restore unsigned native build resources
description: Exact recipe/toolchain resources shared by trusted release and maintenance jobs
inputs:
  operation:
    description: restore before preparation, save after successful preparation
    required: false
    default: restore
  arch:
    description: Native target architecture
    required: true
  msys2-location:
    description: Explicit MSYS2 installation on Windows
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Keep the actual compiler version aligned with the locked CUA workspace.
    - name: Setup Rust toolchain (Computer Use helper)
      if: inputs.operation == 'restore'
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.97.1
        # The pinned CUA workspace requests this component. Resolve it before
        # cache identity probes instead of letting the first rustc call install it.
        components: rustfmt
    - name: Resolve native build cache identities
      id: identity
      continue-on-error: true
      shell: bash
      env:
        TARGET_ARCH: ${{ inputs.arch }}
        MSYS2_LOCATION: ${{ inputs.msys2-location }}
      run: node scripts/client/native-build-cache.mjs keys >> "$GITHUB_OUTPUT"
    - name: Share unsigned Computer Use helper
      if: steps.identity.outputs.helper != ''
      uses: ./.github/actions/build-resource-artifact
      with:
        operation: ${{ inputs.operation }}
        kind: helper
        arch: ${{ inputs.arch }}
        key: ${{ steps.identity.outputs.helper }}
    - name: Share admitted unsigned capture resources
      if: steps.identity.outputs.capture != ''
      uses: ./.github/actions/build-resource-artifact
      with:
        operation: ${{ inputs.operation }}
        kind: capture
        arch: ${{ inputs.arch }}
        key: ${{ steps.identity.outputs.capture }}
    - name: Report unavailable cache identity
      if: steps.identity.outcome != 'success'
      shell: bash
      run: echo 'Native resource cache identity unavailable; original cold preparation remains enabled.' >> "$GITHUB_STEP_SUMMARY"
