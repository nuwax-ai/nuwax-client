# nuwa-sdlc-kit · 规则文件 evals 门禁（播种一次，本地所有；后续修改归本仓）
# 只验证实际执行的 hooks；文档与计划不影响这些固定夹具。
name: sdlc-evals
on:
  pull_request:
    branches: [main]
    paths: ['.claude/hooks/**', 'scripts/sdlc-evals.mjs', '.github/workflows/sdlc-evals.yml']
  push:
    branches: [main]
    paths: ['.claude/hooks/**', 'scripts/sdlc-evals.mjs', '.github/workflows/sdlc-evals.yml']
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 规则层 evals（引擎 hooks 行为断言）
        run: node scripts/sdlc-evals.mjs --dir .
