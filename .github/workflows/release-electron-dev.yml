# 版本、触发路由与续跑规范：docs/release-channels.md；脚本入口：docs/npm-scripts.md。
# Nuwax 商业版 — beta 预发布（v*-beta.* 触发，构建成功后公开 Release）
# 商业产品壳（基座仓 nuwax-ai/nuwa-electron-shell main 分支承载业务）：
# 路径前缀 nuwa-electron-shell/、checkout 后以 github.token 拉基座 submodule、pnpm 显式版本、
# 旧沙箱资源排除。通道 nuwax-electron/；品牌/端口注入与 release-electron.yml 一致。

# Electron 桌面客户端 — 预发布版本构建
# 通过 v*-beta.* tag 触发，构建全平台安装包并创建 GitHub Draft Release，
# 五个平台均构建成功后调用同步 workflow 校验来源/哈希，发布 beta 指针及公开 prerelease。
# workflow_dispatch / codex/beta-qa/X.Y.Z-qa.YYYYMMDD.N 只输出 7 天 Actions artifacts；
# manifest 的 qa-v完整版本是独立构建标识，不创建 tag/Release，不改更新指针。
#
# 触发方式（手动，无 nuwaxcode 自动联动）：
#   1. 确认 nuwaxcode GitHub Release 已就绪（当前 v1.17.11）
#   2. 准备 release-notes/v{x.y.z}-beta.1.md
#   3. git tag v{x.y.z}-beta.1 && git push origin v{x.y.z}-beta.1
#   隔离 QA：workflow_dispatch(version=X.Y.Z-qa.YYYYMMDD.N) 或推送冻结 HEAD 到对应 codex/beta-qa/ 分支。
#   → 源码门禁 → 五平台构建 → 自动校验同步 beta 指针 → 公开 prerelease
#
# 支持平台：
#   - macOS arm64（macos-latest）
#   - macOS x64（macos-latest, cross-compile）
#   - Windows x64（NSIS EXE + MSI；beta 使用 CI 原产未签名 EXE）
#   - Linux x64（AppImage + deb）
#   - Linux arm64（AppImage + deb）
#
# 使用的 Secrets（可与 Tauri 共用 Apple 相关，也可单独配置）：
#   - GH_PAT（可选）：创建 Release、上传资产（未配置时自动回退到 github.token，需 Contents: Write）
#   - macOS 签名/公证（未配置时 Mac 构建无法通过发布门禁）：
#     - APPLE_TEAM_ID / APPLE_SIGNING_IDENTITY / APPLE_CERTIFICATE（.p12 Base64）/ APPLE_CERTIFICATE_PASSWORD
#     - 公证：APPLE_API_KEY（.p8 Base64）/ APPLE_API_KEY_ID / APPLE_ISSUER_ID
#   - Windows：beta 不签名；stable 在正式版流程中使用 SimplySign 签名
#   - S3/OSS 凭据供复用的 sync-electron-to-oss.yml 使用
#
# 产物目录：nuwa-electron-shell/crates/agent-electron-client/release/${version}/（由 package.json directories.output 决定）

name: Release Electron App (Prerelease, Nuwax)

on:
  push:
    tags:
      - "v*-beta.*"
    branches:
      - "codex/beta-qa/**"
  workflow_dispatch:
    inputs:
      version:
        description: "QA version X.Y.Z-qa.YYYYMMDD.N (for example 3.0.9-qa.20261008.1); no release tag is created"
        required: true
        type: string
      windows_archive:
        description: "Windows QA installer extraction policy"
        required: true
        type: choice
        default: zip-qa
        options:
          - 7z
          - zip-qa

permissions:
  actions: read
  contents: write

jobs:
  validate-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG" beta >> "$GITHUB_OUTPUT"

  verify-source:
    if: always() && (needs.validate-tag.result == 'success' || needs.validate-tag.result == 'skipped')
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prepare:
    name: Prepare release
    needs: [validate-tag, verify-source]
    if: always() && needs.verify-source.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      windows_archive: ${{ steps.version.outputs.windows_archive }}
      qa_build: ${{ steps.version.outputs.qa_build }}
      native_version: ${{ steps.version.outputs.native_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve frozen build identity
        id: version
        shell: bash
        env:
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
          BUILD_SHA: ${{ github.sha }}
          VERSION_INPUT: ${{ inputs.version }}
          WINDOWS_ARCHIVE_INPUT: ${{ inputs.windows_archive }}
        run: |
          set -euo pipefail
          WINDOWS_ARCHIVE=""
          QA_BUILD=false
          case "$BUILD_EVENT:$BUILD_REF" in
            push:refs/tags/v*-beta.*)
              TAG="${BUILD_REF#refs/tags/}"
              node scripts/release-version.mjs "$TAG" beta > /tmp/build-release-identity
              VERSION="$(sed -n 's/^version=//p' /tmp/build-release-identity)"
              ;;
            push:refs/heads/codex/beta-qa/*)
              VERSION="${BUILD_REF#refs/heads/codex/beta-qa/}"
              QA_BUILD=true
              WINDOWS_ARCHIVE=zip-qa
              ;;
            workflow_dispatch:refs/heads/*)
              VERSION="$VERSION_INPUT"
              QA_BUILD=true
              WINDOWS_ARCHIVE="$WINDOWS_ARCHIVE_INPUT"
              case "$WINDOWS_ARCHIVE" in
                7z|zip-qa) ;;
                *) echo "::error::Invalid Windows QA archive policy"; exit 1 ;;
              esac
              ;;
            *) echo "::error::Unsupported build event/ref"; exit 1 ;;
          esac
          if [ "$QA_BUILD" = true ]; then
            if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-qa\.[1-9][0-9]{7}\.[1-9][0-9]*$ ]]; then
              echo "::error::QA version must be X.Y.Z-qa.YYYYMMDD.N with a positive attempt"
              exit 1
            fi
            node - "$VERSION" <<'NODE'
          const day = process.argv[2].split('-qa.')[1].split('.')[0];
          const iso = `${day.slice(0, 4)}-${day.slice(4, 6)}-${day.slice(6, 8)}`;
          const date = new Date(`${iso}T00:00:00.000Z`);
          if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0, 10) !== iso) {
            console.error('::error::QA version contains an invalid calendar date');
            process.exit(1);
          }
          NODE
            TAG="qa-v${VERSION}"
            NATIVE_VERSION="${VERSION%%-qa.*}"
          else
            NATIVE_VERSION="${VERSION%%-beta.*}"
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          [ "$SOURCE_SHA" = "$BUILD_SHA" ] || { echo "::error::Checkout differs from frozen workflow SHA"; exit 1; }
          printf 'version=%s\ntag=%s\nsource_sha=%s\nwindows_archive=%s\nqa_build=%s\nnative_version=%s\n' "$VERSION" "$TAG" "$SOURCE_SHA" "$WINDOWS_ARCHIVE" "$QA_BUILD" "$NATIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Build identity: $TAG at $SOURCE_SHA"
          if [ -n "$WINDOWS_ARCHIVE" ]; then
            echo "QA artifacts only: build identity is not a created/published release tag"
          fi

      - name: Read release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BUILD_EVENT: ${{ github.event_name }}
          BUILD_REF: ${{ github.ref }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            cp "$NOTES_FILE" release_notes.txt
          elif [ "$BUILD_EVENT" != push ] || [[ "$BUILD_REF" != refs/tags/v*-beta.* ]]; then
            echo "::error::QA builds require committed release notes: $NOTES_FILE"
            exit 1
          else
            echo "女娲Nuwax ${VERSION} (Prerelease)。请在 Assets 中下载对应平台安装包。" > release_notes.txt
          fi

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            [ "$DRAFT" = true ] || { echo "::error::已公开的 Release 不允许覆盖资产: $TAG"; exit 1; }
            echo "Draft Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "女娲Nuwax (Electron) ${{ steps.version.outputs.version }} - Prerelease" \
              --notes-file release_notes.txt \
              --draft \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
            echo "Created release $TAG"
          fi

  build-electron:
    name: Build Electron (${{ matrix.platform }} ${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: arm64
            dist_cmd: dist:mac:arm64
          - platform: macos-latest
            arch: x64
            dist_cmd: dist:mac:x64
          - platform: windows-latest
            arch: x64
            dist_cmd: dist:win
          - platform: ubuntu-24.04
            arch: x64
            dist_cmd: dist:linux:x64

          - platform: ubuntu-24.04-arm
            arch: arm64
            dist_cmd: dist:linux:arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      # 显式 submodule init（不依赖 checkout action 内部递归 sync）：
      # nuwa-electron-shell submodule → 基座仓 nuwax-ai/nuwa-electron-shell 的 main 分支（公开，
      #   github.token 注入凭据）；nuwax → 壳根前端 pin（公开可匿名拉取，gitlink 须在
      #   声明远端上可获取；基座已不含内嵌 nuwax——前端 dist 打包来源=壳根 nuwax/dist）
      - name: Init submodules (nuwa-electron-shell + nuwax)
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
          YICHAMAO_GIT_TOKEN: ${{ secrets.YICHAMAO_GIT_TOKEN }}
          YICHAMAO_GIT_USERNAME: ${{ secrets.YICHAMAO_GIT_USERNAME || 'oauth2' }}
        run: |
          # submodule 认证统一走 gh CLI 凭据助手（跨平台一致；Windows Git 的
          # GCM 会劫持/覆盖 URL 内嵌凭据，insteadOf 亦不生效——均实测失败）
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          # 前端嵌套子模块在私有 GitLab（git.yichamao.com）：凭据经 http.extraHeader 按域注入
          # （actions/checkout 同款机制；不改写 URL/credential——upgrade:micro-apps 的
          # origin/.gitmodules 一致性预检依赖原始 remote URL，insteadOf/credential helper 均实测翻车）
          if [ -n "$YICHAMAO_GIT_TOKEN" ]; then
            git config --global http.https://git.yichamao.com/.extraheader \
              "Authorization: Basic $(printf '%s:%s' "$YICHAMAO_GIT_USERNAME" "$YICHAMAO_GIT_TOKEN" | base64 | tr -d '\r\n')"
          fi
          git submodule update --init nuwa-electron-shell
          git submodule update --init nuwax
          # 前端嵌套子模块（micro-apps 构建期升级依赖）
          git -C nuwax submodule update --init --recursive
          git submodule status
          # 强校验：submodule update 内部重试失败时可能以 0 退出（第三次 CI 实测假绿）
          test -d nuwa-electron-shell/crates/agent-electron-client || { echo "::error::nuwa-electron-shell submodule not checked out"; exit 1; }
          test -f nuwax/package.json || { echo "::error::nuwax source submodule not checked out"; exit 1; }
          test -d nuwax/submodules/nuwax-repo-web || { echo "::error::nuwax nested submodule nuwax-repo-web not checked out"; exit 1; }

      # 商业自有代码整文件覆写进基座工作树（overlay/ 机制见 scripts/sync-overlay.js）
      - name: Sync overlay into base worktree
        shell: bash
        run: |
          node scripts/sync-overlay.js
          node scripts/sync-overlay.js --check
          git -C nuwa-electron-shell status --short | head -40 || true

      - name: Exercise Windows installer recovery with isolated fixtures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-installer-recovery.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer recovery fixtures failed.' }

      - name: Set version & commercial branding in package.json
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          QA_BUILD: ${{ needs.prepare.outputs.qa_build }}
          NATIVE_VERSION: ${{ needs.prepare.outputs.native_version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          npm pkg set version="$VERSION"
          # package.version 保留完整 Beta/QA 标识；原生版本字段使用数字基线，便于 Mac 公证及 Windows 安装器。
          if [ "$QA_BUILD" = true ] || [[ "$VERSION" == *-beta.* ]]; then
            npm pkg set build.buildVersion="$NATIVE_VERSION"
            npm pkg set build.mac.bundleShortVersion="$NATIVE_VERSION"
            # dmg-builder 默认用 bundleShortVersion 命名 DMG；Beta/QA 包文件必须保留完整应用版本。
            node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const arch = process.env.TARGET_ARCH;
          if (!['x64', 'arm64'].includes(arch)) throw new Error('Invalid prerelease artifact architecture');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.dmg = { ...pkg.build.dmg, artifactName: '${productName}-${version}' + (arch === 'arm64' ? '-arm64' : '') + '.${ext}' };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          fi
          # 商业身份：文件名/包名一律 ASCII（productName=Nuwax；appId 尾段与
          # 注入 identifier 一致=nuwax）。面向用户的「显示名」与「文件名」分离：
          # 显示名走中文营销名 女娲Nuwax（mac CFBundleDisplayName / win NSIS 向导+
          # 快捷方式 / linux desktop Name），文件名、包名、UA token、userData
          # 目录名一律保持 ASCII Nuwax 不变。
          npm pkg set build.appId="com.nuwax-ai.nuwax"
          npm pkg set build.productName="Nuwax"
          # electron-updater 缓存目录名 = sanitize(包名)+"-updater"（builder 25.1.8 无
          # electronUpdaterCacheDirName 配置键，唯一改法是有效包名）。基座 scoped 包名
          # @nuwax-ai/nuwaclaw 与社区版 NuwaClaw 同源，两边都烤出同一个
          # @nuwax-ainuwaclaw-updater 缓存目录，同机双装时 electron-updater 下载前
          # emptyDir(pending) 互清对方安装包（v1.0.45 升级「Windows 找不到文件」实证）。
          # extraMetadata.name 在 AppInfo 构建前 deepAssign 合并，商业版缓存目录由此
          # 隔离为 nuwax-updater，与本地 npm run pack（builderConfig 同键）一致；
          # artifactName 全走 ${productName}、deb/rpm packageName 已显式覆盖，不受影响。
          npm pkg set build.extraMetadata.name="nuwax"
          # 顶层 productName：Electron app.getName() 优先读它——商业版更新调试信息与
          # 打包 userData 目录名显示 Nuwax 而非内部 scoped 包名（产物命名仍以 build.productName 为准）。
          # ⚠️ 必须保持 ASCII：autoUpdater 用 app.getName() 拼「Uninstall <name>.exe」
          # 定位 NSIS 卸载程序，与 NSIS 的 PRODUCT_FILENAME 同源，改中文会断更新链。
          npm pkg set productName="Nuwax"
          # 基座 mac.extendInfo 的 CFBundleName/DisplayName 是社区版展示名（女娲 Nuwax，
          # 带空格）；CFBundleIdentifier 删除以与 appId 统一。
          # CFBundleName 保持 ASCII（访达排序/兼容），CFBundleDisplayName 走中文营销名。
          npm pkg set build.mac.extendInfo.CFBundleName="Nuwax"
          npm pkg set build.mac.extendInfo.CFBundleDisplayName="女娲Nuwax"
          npm pkg delete build.mac.extendInfo.CFBundleIdentifier || true
          # win NSIS 快捷方式名（开始菜单/桌面）；向导标题与正文由 overlay 的
          # build/installer.nsh customHeader 宏覆写 Name（底部 BrandingText 仍为 Nuwax <ver>）
          npm pkg set build.nsis.shortcutName="女娲Nuwax"
          # installer.nsh 的二次 Name 覆写触发 NSIS warning 6029（Name specified
          # multiple times），electron-builder 默认 -WX 把 warning 当 error 直接炸掉
          # makensis（v1.0.5 win 实证）。6029 仅"浪费空间"无实害，须写入真布尔
          # false 关掉（app-builder-lib NsisTarget 是 === false 严格判断，
          # npm pkg set 会写成字符串 "false" 不生效，故用 node 直写）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.nsis=j.build.nsis||{};j.build.nsis.warningsAsErrors=false;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # linux 安装包内部包名（基座默认为社区标识 nuwaclaw）；desktop entry Name
          # 覆盖 productName 派生的默认显示名，包名/文件名不受影响
          npm pkg set build.deb.packageName="nuwax"
          npm pkg set build.rpm.packageName="nuwax"
          npm pkg set build.linux.desktop.entry.Name="女娲Nuwax"
          # 前端 dist 打包来源（基座已中立化移除该条目）：壳根 nuwax/dist →
          # resources/nuwax-dist（dev 形态运行时经 NUWAX_FRONTEND_DIST env 解析）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(e=>!(e.from&&e.from.includes('nuwax/dist'))).concat([{from:'../../../nuwax/dist',to:'nuwax-dist'}]);fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # 商业版已停用旧沙箱方案，移除通用与 Windows 专用的资源打包条目。
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const legacy=new Set(['sandboxed-bash-mcp','sandboxed-fs-mcp','sandbox-runtime','sandbox-helper']);for(const config of [j.build,j.build.win])if(config?.extraResources)config.extraResources=config.extraResources.filter(e=>!legacy.has(e.to));fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "package.json version: $(npm pkg get version), appId: $(npm pkg get build.appId), productName: $(npm pkg get build.productName), updaterCache: $(npm pkg get build.extraMetadata.name)-updater, extraResources(nuwax-dist): $(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).build.extraResources.filter(e=>e.to==='nuwax-dist').map(e=>e.from).join(','))")"

      - name: Configure short output directory for Windows QA
        if: runner.os == 'Windows' && needs.prepare.outputs.qa_build == 'true'
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const temp = process.env.RUNNER_TEMP;
          const runId = process.env.GITHUB_RUN_ID;
          const attempt = process.env.GITHUB_RUN_ATTEMPT;
          if (!temp || /[\r\n\0]/.test(temp) || !path.win32.isAbsolute(temp)
              || !/^[1-9][0-9]*$/.test(runId || '') || !/^[1-9][0-9]*$/.test(attempt || '')) {
            throw new Error('Invalid Windows QA runner output identity');
          }
          // WiX 的原生文件访问仍受长路径限制；完整 QA 版本留在包名和 metadata 中。
          const output = path.win32.join(temp, `nq-${runId}-${attempt}`).replaceAll('\\', '/');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.build.directories = { ...pkg.build.directories, output };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NUWAX_QA_WINDOWS_OUTPUT_DIR=${output}\n`);
          console.log(`Windows QA output: ${output}`);
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 版本单一事实源=外层 package.json 的 packageManager（pnpm@10.27.0，
      # 此处不写 version input——双声明报 Multiple versions of pnpm specified；
      # `with:` 空映射会 startup_failure，均 v1.0.27 实证）。
      # pnpm 10 壳侧依赖构建脚本白名单 pnpm.onlyBuiltDependencies 已配齐 7 项。
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json

      # 与正式版相同：从冻结客户端 SHA 的 gitlink 构建前端，五个平台来源一致。
      - name: Build pinned nuwax frontend dist
        shell: bash
        run: ./scripts/prepare-nuwax-dist.sh

      # Python 3.12+ 移除了 distutils，node-gyp（better-sqlite3 等 native 模块）依赖它；安装 setuptools 以提供 distutils
      - name: Install setuptools for node-gyp (Python 3.12+)
        shell: bash
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      # Linux 构建 deb/rpm 包需要 rpm 工具；arm64 runner 需要系统 fpm（内置 fpm 仅 x86）
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev
          sudo gem install fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      # agent-kit 经根 package.json 的 pnpm.overrides file: 引用——install 会把它
      # 打包成快照拷入 node_modules；必须先构建出 dist 再 install，否则快照无入口
      - name: Build agent-kit (before install)
        shell: bash
        working-directory: nuwa-electron-shell
        run: |
          pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          pnpm -C crates/agent-kit run build

      # pnpm install 会建立 workspace 链接，nuwax-mcp-stdio-proxy 通过 prepare 脚本自动构建
      # pnpm workspace 根在基座（nuwa-electron-shell/）内
      - name: Install workspace dependencies
        working-directory: nuwa-electron-shell
        run: pnpm install --filter @nuwax-ai/nuwaclaw...

      # 为 Electron 内嵌 Node 重编 better-sqlite3，避免 Linux arm64 等平台运行时 "cannot open shared object file"
      - name: Rebuild native modules for Electron
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: npm run electron-rebuild

      - name: Install commercial dependencies
        run: node scripts/client/commercial-dependencies.mjs

      # 缓存内置 Node.js（所有平台）、Git（仅 Windows）、uv（所有平台）和 nuwaxcode（所有平台）
      - name: Cache bundled Node.js
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/node
          key: bundled-node-24-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/package.json') }}

      - name: Cache bundled Git (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/git
          key: bundled-git-2.47.1-windows-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/package.json') }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/uv
          key: bundled-uv-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-uv.js') }}

      - name: Cache nuwaxcode
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/nuwaxcode
          # 版本前缀隔离旧缓存；prepare 脚本内容变化也会令缓存失效
          key: bundled-nuwaxcode-1.17.11-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-nuwaxcode.js') }}

      - name: Cache ripgrep
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/ripgrep
          key: bundled-ripgrep-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-ripgrep.js') }}

      - name: Prepare bundled resources (uv, node, git, nuwaxcode, ripgrep)
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          NUWAX_APP_IDENTIFIER: nuwax
        run: npm run prepare:all
        timeout-minutes: 15

      # ---- macOS：导入证书并配置公证（可选） ----
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not set, signing will be skipped"
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=actions
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "Apple notarization secrets not set, notarization will be skipped"
            exit 0
          fi
          if [ -z "${APPLE_ISSUER_ID:-}" ]; then
            echo "APPLE_ISSUER_ID required for notarization"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple-api-key"
          echo -n "$APPLE_API_KEY" | base64 --decode -o "$RUNNER_TEMP/apple-api-key/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_ISSUER_ID=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"

      # ---- Computer Use helper（cua-driver 源码自建）：五平台全矩阵 ----
      # 源码锁版 + nuwax 补丁 → cargo build → mac .app / win exe / linux 裸二进制 → mac 预签
      # Developer ID（进 extraResources 前签好；TCC 授权跨版本稳定=同 Team+同 bundle id，
      # 见 docs/20260917-computer-use-integration-v2.md 附录 D 与权限矩阵文档）
      - name: Setup Rust toolchain (Computer Use helper)
        uses: dtolnay/rust-toolchain@stable

      - name: Build Computer Use helper (cua-driver)
        shell: bash
        env:
          OUT_DIR: nuwa-electron-shell/crates/agent-electron-client/resources/computer-use
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            # 对齐上游官方 CI 构建清单：x11 2.21 FFI crate 链 libX11/libXi/libXtst/libXext；
            # wayland 栈纯 Rust backend 不需要 libwayland-dev；pipewire/libei 为
            # portal-capture/portal-input feature 设施，默认 feature 不启用不装
            sudo apt-get update -qq && sudo apt-get install -y -qq clang pkg-config libdbus-1-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev
          fi
          case "${{ runner.os }}/${{ matrix.arch }}" in
            macOS/arm64) TRIPLE=aarch64-apple-darwin ;;
            macOS/x64)   TRIPLE=x86_64-apple-darwin ;;
            Windows/x64) TRIPLE=x86_64-pc-windows-msvc ;;
            Linux/x64)   TRIPLE=x86_64-unknown-linux-gnu ;;
            Linux/arm64) TRIPLE=aarch64-unknown-linux-gnu ;;
            *) echo "::error::no cua target for ${{ runner.os }}/${{ matrix.arch }}"; exit 1 ;;
          esac
          export TARGET_TRIPLE="$TRIPLE"
          bash scripts/computer-use/build-helper.sh

      # extraResources 注入（目录随构建产出）
      - name: Inject computer-use extraResources
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(e=>!(e.to&&e.to==='computer-use')).concat([{from:'resources/computer-use',to:'computer-use'}]);fs.writeFileSync(p,JSON.stringify(j,null,2));"
          test -d resources/computer-use && echo "computer-use extraResources injected: $(ls resources/computer-use)"

      # 若用户看到「已损坏」：请确认已配置 APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY 及公证用 APPLE_API_KEY 等，且构建日志中有签名与公证成功
      # Windows 签名已废弃，改为本地手签方案
      - name: Clean previous build artifacts
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          rm -rf release node_modules/.cache
          echo "Cleaned release and cache directories"

      - name: Build Electron app
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SKIP_PREPARE: "1"
          # QA only; public tag pushes retain the default 7z installer policy.
          NUWAX_WINDOWS_INSTALLER_ARCHIVE: ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_archive == 'zip-qa' && 'zip-qa' || '' }}
          # 商业版品牌注入（构建期经 esbuild/vite define 固化）：
          # identifier=nuwax → 数据目录 ~/.nuwax（迁移链已被 overlay 阻断，全新开始）
          NUWAX_APP_IDENTIFIER: nuwax
          NUWAX_APP_DISPLAY_NAME: "Nuwax"
          # 新安装且未显式设置更新通道时默认 beta；业务服务域与更新通道独立。
          NUWAX_RELEASE_CHANNEL: beta
          # 独立更新通道（客户端 autoUpdater 的 OSS_BASE）
          NUWAX_UPDATE_FEED_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com/nuwax-electron"
          NUWAX_DOWNLOAD_PAGE_URL: "https://nuwax.com"
          # 端口整体 +1000（19099/61002~61009/61173），与社区版/nuwa-cli 同机错开
          NUWAX_PORT_OFFSET: "1000"
        run: |
          echo "Building Electron app for ${{ runner.os }} (${{ matrix.arch }})"
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${{ secrets.APPLE_CERTIFICATE || '' }}" ]; then
            echo "APPLE_CERTIFICATE not set — using unsigned mac build"
            case "${{ matrix.arch }}" in
              arm64) npm run dist:mac:unsigned:arm64 -- --publish never ;;
              x64)   npm run dist:mac:unsigned:x64 -- --publish never ;;
              *)     npm run ${{ matrix.dist_cmd }} -- --publish never ;;
            esac
          else
            APPLE_SIGNING_IDENTITY="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            CSC_NAME="${{ secrets.APPLE_SIGNING_IDENTITY }}" \
              npm run ${{ matrix.dist_cmd }} -- --publish never
          fi

      - name: Record platform source and verify macOS signature
        shell: bash
        env:
          QA_BUILD: ${{ needs.prepare.outputs.qa_build }}
          BUILD_IDENTITY: ${{ needs.prepare.outputs.tag }}
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in macOS) PLATFORM=macos;; Windows) PLATFORM=windows;; Linux) PLATFORM=linux;; esac
          VERSION="$BUILD_VERSION"
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${VERSION}"
          if [ "$QA_BUILD" = true ] && [ "$PLATFORM" = windows ]; then
            : "${NUWAX_QA_WINDOWS_OUTPUT_DIR:?Short Windows QA output missing}"
            OUT_DIR="$NUWAX_QA_WINDOWS_OUTPUT_DIR"
          fi
          if [ "$PLATFORM" = macos ]; then
            for value in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_ID APPLE_ISSUER_ID; do
              [ -n "${!value}" ] || { echo "::error::${value} is required for signed macOS builds"; exit 1; }
            done
            APP_PATH="$(find "$OUT_DIR" -maxdepth 3 -type d -name Nuwax.app -print -quit)"
            [ -n "$APP_PATH" ] || { echo '::error::macOS app missing'; exit 1; }
            codesign --verify --deep --strict "$APP_PATH"
            spctl --assess --type execute --verbose "$APP_PATH"
            compgen -G "$OUT_DIR/*.dmg" >/dev/null || { echo '::error::macOS DMG missing'; exit 1; }
          fi
          case "$QA_BUILD" in
            true) PROVENANCE_COMMAND=record-qa ;;
            false) PROVENANCE_COMMAND=record ;;
            *) echo '::error::Invalid QA build mode'; exit 1 ;;
          esac
          node scripts/release-provenance.mjs "$PROVENANCE_COMMAND" "$BUILD_IDENTITY" "$PLATFORM" "$TARGET_ARCH" "$OUT_DIR"

      - name: Upload artifacts to Release
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${VERSION}"
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Output directory not found: $OUT_DIR"
            exit 1
          fi
          for f in "${OUT_DIR}"/*; do
            [ -e "$f" ] || continue
            [ -f "$f" ] || continue
            # electron-builder 构建告警时写入输出目录的调试转储；不在 build-manifest/provenance
            # 资产清单内，上传会让最终镜像校验（Release 资产须被 provenance 全覆盖）必然失败。
            [ "$(basename "$f")" = "builder-debug.yml" ] && { echo "Skipping $(basename "$f") (builder debug dump)"; continue; }
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Stage isolated QA packages and build context
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
        id: qa_artifacts
        shell: bash
        env:
          QA_VERSION: ${{ needs.prepare.outputs.version }}
          QA_BUILD_IDENTITY: ${{ needs.prepare.outputs.tag }}
          QA_SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          QA_EVENT: ${{ github.event_name }}
          QA_REF: ${{ github.ref }}
          QA_ARCHIVE: ${{ runner.os == 'Windows' && needs.prepare.outputs.windows_archive || '' }}
          QA_PLATFORM: ${{ runner.os }}
        run: |
          set -euo pipefail
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${QA_VERSION}"
          if [ "$QA_PLATFORM" = Windows ]; then
            : "${NUWAX_QA_WINDOWS_OUTPUT_DIR:?Short Windows QA output missing}"
            OUT_DIR="$NUWAX_QA_WINDOWS_OUTPUT_DIR"
          fi
          STAGE_DIR="$RUNNER_TEMP/nuwax-qa-${{ runner.os }}-${{ matrix.arch }}"
          mkdir -p "$STAGE_DIR"
          for file in "$OUT_DIR"/*; do
            [ -f "$file" ] || continue
            [ "$(basename "$file")" = builder-debug.yml ] && continue
            cp "$file" "$STAGE_DIR/"
          done
          cp "release-notes/${QA_BUILD_IDENTITY}.md" "$STAGE_DIR/acceptance-notes.md"
          export QA_STAGE_DIR="$STAGE_DIR"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const client = git('rev-parse', 'HEAD');
          if (client !== process.env.QA_SOURCE_SHA) throw new Error('QA checkout does not match frozen source SHA');
          const context = {
            schemaVersion: 1,
            version: process.env.QA_VERSION,
            buildIdentity: process.env.QA_BUILD_IDENTITY,
            identityMeaning: 'Build manifest identity only; no release tag is created by this QA run',
            distribution: 'github-actions-artifacts',
            published: false,
            tagCreated: false,
            updatePointersChanged: false,
            event: process.env.QA_EVENT,
            ref: process.env.QA_REF,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            windowsArchive: process.env.QA_ARCHIVE || null,
            source: { client, shell: git('rev-parse', 'HEAD:nuwa-electron-shell'), frontend: git('rev-parse', 'HEAD:nuwax') },
          };
          writeFileSync(join(process.env.QA_STAGE_DIR, 'qa-build-context.json'), `${JSON.stringify(context, null, 2)}\n`);
          NODE
          printf 'path=%s\n' "$STAGE_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload isolated QA packages
        if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: nuwax-qa-${{ needs.prepare.outputs.version }}-${{ runner.os }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.qa_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish-beta:
    name: Publish beta after five platform builds
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-electron
    uses: ./.github/workflows/sync-electron-to-oss.yml
    with:
      tag: ${{ github.ref_name }}
      channel: beta
    secrets: inherit
