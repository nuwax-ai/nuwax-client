# 构建并发布 Linux 原生件构建镜像（glibc 2.28，Debian 10）。
#
# 为什么需要这个镜像：发布 runner 是 Ubuntu 24.04（glibc 2.39），在那里编出的原生件
# 带 GLIBC_2.34～2.39 的符号，在 UOS 20 Pro 1050（glibc 2.28）上加载即失败。
# 镜像只在 glibc 2.28 的环境里编译 better-sqlite3、capture ffmpeg 和 cua-driver；
# 打包仍在 runner 上做。背景与各个坑见 docker/linux-native/README.md。
#
# 镜像 tag 是 Dockerfile、versions.env、gxx-shim.sh 三个文件的内容哈希，内容一变 tag 就变。
# 同一个 tag 重复推送是幂等的，所以这个 workflow 可以随意重跑。
#
# 触发：这三个文件（或本 workflow、镜像脚本）有改动推到任意分支，或手动触发。
# 只改 README 不会触发：它不参与哈希。
name: Linux native build image

on:
  push:
    paths:
      - 'docker/linux-native/Dockerfile'
      - 'docker/linux-native/versions.env'
      - 'docker/linux-native/gxx-shim.sh'
      - '.github/actions/linux-native-step/action.yml'
      - '.github/workflows/linux-native-image.yml'
      - 'scripts/client/linux-native-image.mjs'
      - 'scripts/client/linux-native-step.mjs'
      - 'scripts/client/linux-glibc-gate.mjs'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: linux-native-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nuwax-ai/nuwax-linux-native

jobs:
  build:
    name: Build and push (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 原生 runner，不用 QEMU：编 git 和三个原生件都快得多。
          - arch: amd64
            runner: ubuntu-24.04
            target_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve the image tag and build arguments from the recipe content
        id: image
        shell: bash
        run: |
          echo "tag=$(node scripts/client/linux-native-image.mjs tag)" >> "$GITHUB_OUTPUT"
          # One KEY=value per line, which is what docker/build-push-action's build-args takes.
          {
            echo "build-args<<EOF"
            node scripts/client/linux-native-image.mjs build-args
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/linux-native
          file: docker/linux-native/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # 由镜像脚本从 versions.env 生成，workflow 里不手写版本和校验和。
          build-args: |
            ${{ steps.image.outputs.build-args }}
          # 逐架构推送，再合并成一个多架构 tag：两个架构都成功后才出现最终 tag。
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export the per-arch digest
        id: export
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          echo "${DIGEST#sha256:}" > "/tmp/digests/${{ matrix.arch }}"
          echo "written $(cat /tmp/digests/${{ matrix.arch }})"

      - name: Upload the per-arch digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge into one multi-arch tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the per-arch digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag from the recipe content
        id: image
        shell: bash
        run: |
          echo "tag=$(node scripts/client/linux-native-image.mjs tag)" >> "$GITHUB_OUTPUT"

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          # docker buildx imagetools create 把各架构的 digest 合成一个清单。
          # 同一个 tag 再次创建时内容相同，是幂等的。
          docker buildx imagetools create \
            --tag "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' $(cat amd64)) \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' $(cat arm64))
          echo "published ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" \
            | grep -E "Platform:|MediaType:" | sort | uniq -c

  verify:
    name: Verify the published image
    needs: merge
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target_arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target_arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag from the recipe content
        id: image
        shell: bash
        run: |
          echo "tag=$(node scripts/client/linux-native-image.mjs tag)" >> "$GITHUB_OUTPUT"

      # 镜像不合格就不该被 CI 用：在刚发布的镜像里把三个原生件各编一遍，
      # 任何一个的 glibc 需求超过上限即失败。用的是仓库自己的脚本，和发布时一模一样。
      - name: Pull and check the image's own glibc
        env:
          TAG: ${{ steps.image.outputs.tag }}
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          docker pull --platform linux/${{ matrix.arch }} "$REF"
          docker run --rm --platform linux/${{ matrix.arch }} "$REF" sh -c '
            set -eu
            echo "glibc: $(ldd --version | head -n 1)"
            echo "gcc:   $(gcc --version | head -n 1)"
            echo "g++:   $(g++ --version | head -n 1)"
            echo "git:   $(git --version)"
            echo "node:  $(node --version)"
            echo "python: $(python3 --version)"
            echo "rustc: $(rustc --version)"
            echo "curl:  $(curl --version | head -n 1 | cut -c1-40)"
            curl --retry-all-errors --help > /dev/null
            test "$(ldd --version | head -n 1 | grep -oE "[0-9]+\.[0-9]+$")" = "2.28"
          '

      # 镜像不合格就不该被 CI 用：用复合 action（和发布 workflow 完全相同的入口）把三个
      # 原生件各编一遍，再由 glibc 门禁判定。走 action 而不是在这里手抄命令，是为了让
      # "镜像验证通过" 严格等价于 "发布 CI 里能用"。
      # 与发布 workflow 的 "Install workspace dependencies" 是同一条命令。在镜像里装，
      # 缓存落在容器可见的 HOME 下，后面的编译直接复用。
      - name: Install workspace dependencies in the published image
        uses: ./.github/actions/linux-native-step
        with:
          # 直接 `corepack pnpm`：它按当前目录 package.json 的 packageManager 字段选版本
          # （这里是 pnpm@9.15.5）。不用 `corepack enable` —— 容器以非 root 运行，
          # 写不了 /opt/node/bin，那条命令会静默地什么都不做。
          command: corepack pnpm install --frozen-lockfile --filter @nuwax-ai/nuwaclaw...
          working-directory: nuwa-electron-shell
          arch: ${{ matrix.target_arch }}
          timeout-minutes: 30

      - name: Build better-sqlite3 in the published image
        uses: ./.github/actions/linux-native-step
        with:
          command: npm run rebuild:better-sqlite3
          working-directory: nuwa-electron-shell/crates/agent-electron-client
          arch: ${{ matrix.target_arch }}

      - name: Build capture ffmpeg in the published image
        uses: ./.github/actions/linux-native-step
        with:
          command: node scripts/client/build-resource-artifacts.mjs measure capture -- node scripts/prepare-release-capture.mjs --arch "$TARGET_ARCH"
          arch: ${{ matrix.target_arch }}
          timeout-minutes: 40
          env: |
            TARGET_ARCH=${{ matrix.target_arch }}
            NUWAX_CAPTURE_MAC_SIGNING=false

      - name: Build the cua-driver helper in the published image
        uses: ./.github/actions/linux-native-step
        with:
          arch: ${{ matrix.target_arch }}
          timeout-minutes: 60
          env: |
            OUT_DIR=nuwa-electron-shell/crates/agent-electron-client/resources/computer-use
            NUWAX_CUA_NO_CACHE=1
          command: |
            case "$TARGET_ARCH" in
              x64)   TRIPLE=x86_64-unknown-linux-gnu ;;
              arm64) TRIPLE=aarch64-unknown-linux-gnu ;;
              *) echo "::error::no cua target for $TARGET_ARCH"; exit 1 ;;
            esac
            export TARGET_TRIPLE="$TRIPLE"
            node scripts/client/build-resource-artifacts.mjs measure helper -- bash scripts/computer-use/build-helper.sh

      # 把三个产物摆成安装目录的样子，交给门禁判定。
      - name: Report the glibc floor of everything the image built
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.target_arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/floor/linux-$TARGET_ARCH-unpacked/resources"
          R="$RUNNER_TEMP/floor/linux-$TARGET_ARCH-unpacked/resources"
          cp nuwa-electron-shell/crates/agent-electron-client/node_modules/better-sqlite3/build/Release/better_sqlite3.node "$R/"
          cp resources/capture/linux-$TARGET_ARCH/ffmpeg "$R/"
          cp nuwa-electron-shell/crates/agent-electron-client/resources/computer-use/NuwaxComputerUse "$R/"
          # 三个产物都不得高于 2.28：门禁不带 --report-only，超限即失败。
          node scripts/client/linux-glibc-gate.mjs --verify-output "$RUNNER_TEMP/floor" --platform linux --arch "$TARGET_ARCH"
