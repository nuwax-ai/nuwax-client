# 外层仓测试 CI：双轨门禁 + 基座纯净守卫
#
# 此前本仓 4 个 workflow（smoke/release×2/sync）均无测试步骤——商业侧 1309 条
# 测试门禁只存在于本地。本 CI 把两轨都机制化：
#   community  = base:test 口径（--no-inject：干净基座 + 社区默认值）
#   commercial = test:commercial 口径（in-base 注入：sync-overlay + 商业 env）
# 两轨 vitest 排除项与基座仓 .github/workflows/ci.yml 对齐（sandbox-integration
# 的 linux-bwrap 需真实 bwrap 环境，ubuntu runner 不可用；两文件平台不符时自跳过）。
# commercial 另跑 check-base-purity：基座远端 main 上 overlay 托管路径不得与
# overlay/ 商业版字节相同（防商业代码泄回中立基座）。
name: CI (gates)

# main 与 release 分支的 push、PR 及发布 workflow 的 workflow_call 均跑门禁；
# 普通 feat/** 分支仅在 PR 时执行，避免每次推送都触发全量测试。
on:
  workflow_call:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    name: community gate (base:test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init base submodule
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init nuwa-electron-shell

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json

      # Python 3.12+ 移除 distutils，node-gyp（better-sqlite3）依赖
      - name: Install setuptools for node-gyp
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      # agent-kit 经基座根 package.json 的 pnpm.overrides file: 引用——必须先构建
      # dist 再 install，否则快照无入口（与基座 ci.yml 同因）
      - name: Build agent-kit (before install)
        run: |
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit run build

      - name: Install workspace dependencies
        run: node scripts/in-base.js --no-inject -- pnpm install --filter @nuwax-ai/nuwaclaw...

      # mcp.test.ts 依赖型资源（gitignore，fresh clone 必做）
      - name: Prepare test resources (mcp-proxy)
        run: node scripts/in-base.js --no-inject -- bash -c "cd crates/agent-electron-client && npm run prepare:mcp-proxy"

      - name: Run community tests
        run: node scripts/in-base.js --no-inject -- bash -c "cd crates/agent-electron-client && npx vitest run --exclude 'tests/sandbox-integration/**' --exclude '**/node_modules/**'"

  commercial:
    name: commercial gate (test:commercial + purity)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init base submodule
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init nuwa-electron-shell
          # purity --remote 需要 origin/main 可达（submodule clone 不保证带全量分支引用）
          git -C nuwa-electron-shell fetch origin '+refs/heads/main:refs/remotes/origin/main'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json

      - name: Install setuptools for node-gyp
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      - name: Build agent-kit (before install)
        run: |
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit run build

      - name: Install workspace dependencies
        run: node scripts/in-base.js --no-inject -- pnpm install --filter @nuwax-ai/nuwaclaw...

      - name: Prepare test resources (mcp-proxy)
        run: node scripts/in-base.js --no-inject -- bash -c "cd crates/agent-electron-client && npm run prepare:mcp-proxy"

      - name: Guard scripts self-test
        run: npm run test:scripts

      - name: Run commercial tests
        run: node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npx vitest run --exclude 'tests/sandbox-integration/**' --exclude '**/node_modules/**'"

      - name: Verify overlay matches the tested base worktree
        run: npm run overlay:check

      - name: Check Electron source boundaries and app directory literals
        run: |
          node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npm run check:boundaries"
          node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npm run check:appdir"

      - name: Purity guard (base worktree + origin/main)
        run: |
          npm run check:pin
          npm run check:pin -- --remote origin/main

  frontend:
    name: frontend source gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Init pinned frontend
        run: git submodule update --init nuwax
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          package_json_file: nuwax/package.json
      - name: Install frontend dependencies
        run: pnpm -C nuwax install --frozen-lockfile
      - name: Run frontend tests and architecture check
        run: |
          pnpm -C nuwax exec vitest run
          pnpm -C nuwax lint:arch
