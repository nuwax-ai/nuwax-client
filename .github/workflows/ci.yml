# 版本、触发路由与续跑规范：docs/release-channels.md；脚本入口：docs/npm-scripts.md。
# 外层仓测试 CI：商业门禁
#
# 壳（nuwa-electron-shell/）已并入本仓直接维护，不再有 overlay 同步与社区基线轨，
# 只保留 commercial = test:commercial 口径（in-base：商业依赖准备，不注入 env）。
# vitest 排除项沿用原基座 CI（sandbox-integration 的 linux-bwrap 需真实 bwrap 环境，
# ubuntu runner 不可用；两文件平台不符时自跳过）。
name: CI (gates)

# main 与 release 分支的 push、PR 及发布 workflow 的 workflow_call 均跑门禁；
# 普通 feat/** 分支仅在 PR 时执行，避免每次推送都触发全量测试。
# 仅修改发布说明 Markdown 时不重复占用整组 runner；tag 的 workflow_call 仍跑完整门禁。
on:
  workflow_call:
  push:
    branches: [main, 'release/**']
    paths-ignore: ['release-notes/*.md']
  pull_request:
    branches: [main, 'release/**']
    paths-ignore: ['release-notes/*.md']

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-platform:
    name: desktop CUA and local files
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json
      # Match commercial --no-env preparation, invoking pnpm directly so the
      # Windows runner resolves its command shim without a nested Node spawn.
      - name: Prepare commercial dependencies
        run: node scripts/client/commercial-dependencies.mjs
      - name: Install agent-kit dependencies
        run: pnpm -C nuwa-electron-shell/crates/agent-kit install --ignore-workspace --prefer-offline
      - name: Build agent-kit
        run: pnpm -C nuwa-electron-shell/crates/agent-kit run build
      - name: Install desktop test dependencies
        run: pnpm -C nuwa-electron-shell install --filter @nuwax-ai/nuwaclaw...
      - name: Prepare MCP test resources
        run: pnpm -C nuwa-electron-shell/crates/agent-electron-client run prepare:mcp-proxy
      - name: Test native filesystem and CUA logic on the actual host platform
        run: >-
          pnpm -C nuwa-electron-shell/crates/agent-electron-client exec vitest run
          src/main/features/local-files src/main/features/computer-use
          src/main/services/commercialAutoUpdater.test.ts
          src/main/ipc/settingsHandlers.hostActivity.test.ts
          src/preload/features/local-files.test.ts
          src/renderer/features/local-files/LocalFilesSettings.test.tsx
          src/renderer/features/computer-use/CuaControls.test.tsx
          src/renderer/features/computer-use/CuaTaskCenter.test.tsx

  terminal-compat:
    name: terminal compatibility protocol and WinPTY regression
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: native/legacy-terminal/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test terminal wire protocol
        working-directory: native/legacy-terminal
        run: go test ./...
      - name: Check concurrent session lifecycle
        if: runner.os == 'Linux'
        working-directory: native/legacy-terminal
        run: go test -race ./...
      - name: Prepare Windows compatibility backend
        if: runner.os == 'Windows'
        run: node scripts/prepare-terminal-compat.mjs --platform win32 --arch x64
      - name: Regress WinPTY on the current Windows runner
        if: runner.os == 'Windows'
        run: node scripts/acceptance/terminal-compat.mjs

  commercial:
    name: commercial gate (test:commercial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init host contract source submodule
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init --depth 1 nuwax

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json

      - name: Install setuptools for node-gyp
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      - name: Build agent-kit (before install)
        run: |
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          node scripts/in-base.js --no-inject -- pnpm -C crates/agent-kit run build

      - name: Install workspace dependencies
        run: node scripts/in-base.js --no-inject -- pnpm install --filter @nuwax-ai/nuwaclaw...

      - name: Prepare test resources (mcp-proxy)
        run: node scripts/in-base.js --no-inject -- bash -c "cd crates/agent-electron-client && npm run prepare:mcp-proxy"

      - name: Guard scripts self-test
        run: npm run test:scripts

      - name: Check host bridge contract snapshot
        run: npm run host-bridge:check

      - name: Check Electron source boundaries and app directory literals
        run: |
          node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npm run check:boundaries"
          node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npm run check:appdir"

      - name: Run commercial tests
        run: node scripts/in-base.js --no-env -- bash -c "cd crates/agent-electron-client && npx vitest run --exclude 'tests/sandbox-integration/**' --exclude '**/node_modules/**'"

  # 前端门禁快路径：门禁结论只由 nuwax pin + 本 workflow 决定。对照提交（push 前一
  # 尖端 / PR base）的 pin 与 ci.yml 均未变、且其 CI (gates) 已全绿时，下游
  # frontend 两个 job 整体跳过（job 级 if，check-run 以 skipped 上报，不缺报）。
  # tag 发版（workflow_call）按发布策略恒全量；任何拿不准的分支一律全量兜底。
  frontend-scope:
    name: frontend gate scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 查对照提交的 CI run 结论需要 actions: read（workflow 顶层仅 contents: read）
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide frontend gate scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARISON_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          echo 'reason=默认全量' >> "$GITHUB_OUTPUT"

          # reusable workflow 的 event_name 可沿用调用者事件；用 tag ref 显式守住发布门禁。
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            echo 'reason=tag 发版（workflow_call）按策略恒全量' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          comparison="${COMPARISON_REF:-}"
          if [ -z "$comparison" ] || [[ "$comparison" =~ ^0+$ ]]; then
            comparison="HEAD^"
          fi
          if ! git cat-file -e "$comparison^{commit}" 2>/dev/null; then
            # push 的 before/PR base 可能不在浅检出里；HEAD^ 在 depth 1 检出必然
            # 拿不到，直接走全量兜底，不做无谓 fetch
            if [ "$comparison" != "HEAD^" ]; then
              git fetch --no-tags --depth 1 origin "$comparison" || true
            fi
            if ! git cat-file -e "$comparison^{commit}" 2>/dev/null; then
              echo "reason=对照提交 ${comparison} 不可得，全量兜底" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          prev_pin="$(git ls-tree "$comparison" -- nuwax | awk '$1 == "160000" {print $3}')"
          curr_pin="$(git ls-tree HEAD -- nuwax | awk '$1 == "160000" {print $3}')"
          prev_wf="$(git rev-parse -q --verify "$comparison:.github/workflows/ci.yml" || true)"
          curr_wf="$(git rev-parse -q --verify "HEAD:.github/workflows/ci.yml" || true)"
          if [ -z "$prev_pin" ] || [ -z "$curr_pin" ] || [ -z "$prev_wf" ] || [ -z "$curr_wf" ]; then
            echo 'reason=pin/workflow 信息不全，全量兜底' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$prev_pin" != "$curr_pin" ] || [ "$prev_wf" != "$curr_wf" ]; then
            echo "reason=nuwax pin ${prev_pin:0:12}→${curr_pin:0:12} 或 ci.yml 有变，全量" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 输入相同还需对照提交的门禁真实全绿过（防 rerun 洗白：没绿过/查不到一律全量）
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${comparison}&per_page=20" \
            --jq '[.workflow_runs[] | select(.name | contains("CI (gates)")) | select(.status == "completed")] | sort_by(.updated_at) | last | .conclusion // ""' || true)"
          if [ "$conclusion" = "success" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "reason=nuwax pin ${curr_pin:0:12} 与 ci.yml 较对照提交 ${comparison:0:12} 均未变，且其 CI (gates) 已全绿，跳过重复门禁" >> "$GITHUB_OUTPUT"
          else
            echo "reason=输入未变但对照提交 CI (gates) 结论=${conclusion:-未找到}，全量兜底" >> "$GITHUB_OUTPUT"
          fi
      - name: Gate scope summary
        if: ${{ !cancelled() }}
        run: echo "${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend source gate
    needs: frontend-scope
    if: needs.frontend-scope.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Init pinned frontend
        env:
          YICHAMAO_GIT_TOKEN: ${{ secrets.YICHAMAO_GIT_TOKEN }}
          YICHAMAO_GIT_USERNAME: ${{ secrets.YICHAMAO_GIT_USERNAME || 'oauth2' }}
        run: |
          # 前端嵌套子模块（micro-frontends 测试 git archive 依赖）在私有 GitLab（git.yichamao.com），
          # 凭据经 http.extraHeader 按域注入（actions/checkout 同款；不改写 URL/credential，
          # upgrade:micro-apps 一致性预检依赖原始 remote URL——insteadOf/helper 均实测翻车）
          if [ -n "$YICHAMAO_GIT_TOKEN" ]; then
            git config --global http.https://git.yichamao.com/.extraheader \
              "Authorization: Basic $(printf '%s:%s' "$YICHAMAO_GIT_USERNAME" "$YICHAMAO_GIT_TOKEN" | base64 | tr -d '\r\n')"
          fi
          git submodule update --init --depth 1 nuwax
          git -C nuwax submodule update --init --recursive
      # pnpm 需先于 setup-node 就位，cache: pnpm 依赖其在 PATH（nuwax 仓自家 CI 同序）
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          package_json_file: nuwax/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: nuwax/pnpm-lock.yaml
      - name: Install frontend dependencies
        id: frontend_install
        run: pnpm -C nuwax install --frozen-lockfile
      - name: Test frontend type gate
        run: pnpm -C nuwax test:typecheck
      - name: Check frontend type domains
        run: pnpm -C nuwax typecheck
      - name: Check frontend architecture
        if: ${{ !cancelled() && steps.frontend_install.outcome == 'success' }}
        run: pnpm -C nuwax lint:arch

  # 全量测试分片双 runner 并行（私有仓 runner 2 核，进程内并行已到顶）：
  # 与 frontend 静态门禁并行跑，墙钟由 ~10m 降到 ~5m。tag/新 pin 场景无跳过路径，
  # 分片是这两条路径唯一的墙钟优化。
  frontend-tests:
    name: frontend test gate
    needs: frontend-scope
    if: needs.frontend-scope.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Init pinned frontend
        env:
          YICHAMAO_GIT_TOKEN: ${{ secrets.YICHAMAO_GIT_TOKEN }}
          YICHAMAO_GIT_USERNAME: ${{ secrets.YICHAMAO_GIT_USERNAME || 'oauth2' }}
        run: |
          # 前端嵌套子模块（micro-frontends 测试 git archive 依赖）在私有 GitLab（git.yichamao.com），
          # 凭据经 http.extraHeader 按域注入（actions/checkout 同款；不改写 URL/credential，
          # upgrade:micro-apps 一致性预检依赖原始 remote URL——insteadOf/helper 均实测翻车）
          if [ -n "$YICHAMAO_GIT_TOKEN" ]; then
            git config --global http.https://git.yichamao.com/.extraheader \
              "Authorization: Basic $(printf '%s:%s' "$YICHAMAO_GIT_USERNAME" "$YICHAMAO_GIT_TOKEN" | base64 | tr -d '\r\n')"
          fi
          git submodule update --init --depth 1 nuwax
          git -C nuwax submodule update --init --recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
          package_json_file: nuwax/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: nuwax/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm -C nuwax install --frozen-lockfile
      - name: Run frontend tests
        # 支付结算专项暂缓（当前 5 条既有失败，单独记债）；其余前端用例仍为发布门禁。
        # recommendFormModal 单条本地 2-3s、CI 慢机超 5s 默认超时，门禁统一抬到 15s（仍能抓真悬挂）。
        run: pnpm -C nuwax exec vitest run --exclude 'tests/paymentSettlement.test.ts' --testTimeout=15000 --shard=${{ matrix.shard }}/2
