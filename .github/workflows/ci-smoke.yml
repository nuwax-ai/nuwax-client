# submodule 连通性探针（手动触发）
#
# 验证两层 submodule 在 CI 环境可拉取：nuwa-electron-shell（基座仓
# nuwax-ai/nuwa-electron-shell main 分支，走 github.token）+ nuwax（公开仓）。
# 与 release workflow 的 Init submodules 步骤同构，在不动发布 tag 的情况下即可
# 回归验证以下变更：
#   - .gitmodules URL 变更 / pin bump（gitlink 须在 .gitmodules 声明分支上可达，
#     当前 nuwax=feat-dong.0930；pin/nuwawork 等为前端仓改名遗留，非硬依赖）
name: CI Smoke (submodules)

on:
  workflow_dispatch:

jobs:
  submodules:
    name: Init submodules probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules (nuwa-electron-shell + nuwax)
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init nuwa-electron-shell
          git submodule update --init nuwax
          git submodule status

      - name: Assert
        run: |
          test -d nuwa-electron-shell/crates/agent-electron-client || { echo "::error::nuwa-electron-shell submodule not checked out"; exit 1; }
          test -f nuwax/package.json || { echo "::error::nuwax source missing (shell root)"; exit 1; }
          echo "submodule topology OK (shell-base@$(git -C nuwa-electron-shell rev-parse --short HEAD), root-nuwax@$(git -C nuwax rev-parse --short HEAD))"
