# Nuwax Stable 发布：客户端源码、壳与构建脚本均固定在本仓 tag。
# nuwax/ 与 nuwax-dist/ 是前端双 pin；stable 校验并消费固定的前端产物。
# 入口：npm run release -- --version X.Y.Z（先 --dry-run）。
# 五平台构建后保留 Draft；macOS 在 CI 签名、公证，Windows 由发布状态机交给 win-pc 签名。
# 安装包验收后显式 --stage sync，核验来源、签名与镜像，再推进更新指针。
# 产品身份、数据目录及 nuwax-electron 通道由本仓配置注入，运行端口由主进程自动分配。
# 壳 workspace 位于 nuwa-electron-shell/，无需其他壳仓库检出或同步。
# 凭据来自发布环境；具体变量与阶段规则见 docs/sign-windows.md、docs/release-channels.md。

name: Release Electron App (Nuwax)

on:
  push:
    tags:
      - "v*"
      - "!v*-beta.*"

permissions:
  actions: read
  contents: write

# 同名 tag 被移动重推时自动取消旧 run，防止两条发布管线并发争抢同一 Release
# 资产与 S3 同步（v3.0.23-beta.10 双 run 竞态的兜底）。既有铁律不变：
# 重打优先顺延版本号新发，此处仅兜底，不构成重打许可。
concurrency:
  group: release-electron-stable-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-tag:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      channel: ${{ steps.identity.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      # concurrency 兜底之外的纵深防线：本 run 启动后 tag 若被移动/删除，
      # 在花长时间构建前直接拦下（构建过期内容并与新 run 竞态上传）。
      - name: Reject superseded tag (moved or deleted after push)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | cut -f1)"
          if [ "${CURRENT}" != "${RUN_SHA}" ]; then
            echo "::error::refs/tags/${RELEASE_TAG} 现指向 ${CURRENT:-<已删除>}，与本 run 的 ${RUN_SHA} 不一致（tag 在本 run 启动后被移动或删除）。请按重打铁律顺延版本号新发。"
            exit 1
          fi
      - id: identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-version.mjs "$RELEASE_TAG" stable >> "$GITHUB_OUTPUT"

  verify-source:
    needs: validate-tag
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  prepare:
    name: Prepare release
    needs: [validate-tag, verify-source]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ needs.validate-tag.outputs.version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            cp "$NOTES_FILE" release_notes.txt
          else
            echo "女娲Nuwax ${VERSION}。请在 Assets 中下载对应平台安装包。" > release_notes.txt
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            [ "$DRAFT" = true ] || { echo "::error::已公开的 Release 不允许覆盖资产: $TAG"; exit 1; }
            echo "Draft Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "女娲Nuwax (Electron) ${{ steps.version.outputs.version }}" \
              --notes-file release_notes.txt \
              --draft \
              --repo "$GITHUB_REPOSITORY"
            echo "Created draft release $TAG"
          fi

  build-electron:
    name: Build Electron (${{ matrix.platform }} ${{ matrix.arch }})
    needs: prepare
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: arm64
            dist_cmd: dist:mac:arm64
          - platform: macos-26-intel
            arch: x64
            dist_cmd: dist:mac:x64
          - platform: windows-latest
            arch: x64
            dist_cmd: dist:win
          - platform: ubuntu-24.04
            arch: x64
            dist_cmd: dist:linux:x64
          - platform: ubuntu-24.04-arm
            arch: arm64
            dist_cmd: dist:linux:arm64

    runs-on: ${{ matrix.platform }}
    env:
      NUWAX_RESOURCE_JOB_NAME: Build Electron (${{ matrix.platform }} ${{ matrix.arch }})

    steps:
      - name: Configure macOS compatibility target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=12.0" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      # 初始化发布 tag 的两个 gitlink（壳 nuwa-electron-shell/ 已并入本仓，随 checkout 即得）；前端嵌套子模块仅源码测试需要，
      # 正式包消费 nuwax-dist pin，无需在五个平台重复拉取/构建它们。
      - name: Init pinned submodules
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          # Windows runner 可能启用 CRLF checkout；五平台必须复制相同的产物字节。
          git config --global core.autocrlf false
          git submodule update --init nuwax
          git submodule update --init nuwax-dist
          git submodule status
          # submodule update 内部重试失败时可能以 0 退出，逐项强校验。
          test -d nuwa-electron-shell/crates/agent-electron-client || { echo "::error::nuwa-electron-shell missing from checkout"; exit 1; }
          test -f nuwax/package.json || { echo "::error::nuwax source submodule not checked out"; exit 1; }
          test -f nuwax-dist/index.html || { echo "::error::nuwax-dist artifact submodule not checked out"; exit 1; }

      - name: Set version & commercial branding in package.json
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          npm pkg set version="$VERSION"
          # 技术身份保持 nuwax；三平台系统名称由下方共享配置统一。
          npm pkg set build.appId="com.nuwax-ai.nuwax"
          # electron-updater 缓存目录名 = sanitize(包名)+"-updater"（builder 25.1.8 无
          # electronUpdaterCacheDirName 配置键，唯一改法是有效包名）。基座 scoped 包名
          # @nuwax-ai/nuwaclaw 与社区版 NuwaClaw 同源，两边都烤出同一个
          # @nuwax-ainuwaclaw-updater 缓存目录，同机双装时 electron-updater 下载前
          # emptyDir(pending) 互清对方安装包（v1.0.45 升级「Windows 找不到文件」实证）。
          # extraMetadata.name 在 AppInfo 构建前 deepAssign 合并，商业版缓存目录由此
          # 隔离为 nuwax-updater，与本地 npm run pack（builderConfig 同键）一致；
          # macOS 显示名与固定 ASCII 分发文件前缀由共享配置分别设置。
          npm pkg set build.extraMetadata.name="nuwax"
          # 原生通知检测模块在 main 构建时生成，需真实文件供加载与签名。
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const old=j.build.asarUnpack;j.build.asarUnpack=[...new Set([...(Array.isArray(old)?old:old?[old]:[]),'dist/main/mac-notification-permission.node'])];fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # installer.nsh 的二次 Name 覆写触发 NSIS warning 6029（Name specified
          # multiple times），electron-builder 默认 -WX 把 warning 当 error 直接炸掉
          # makensis（v1.0.5 win 实证）。6029 仅"浪费空间"无实害，须写入真布尔
          # false 关掉（app-builder-lib NsisTarget 是 === false 严格判断，
          # npm pkg set 会写成字符串 "false" 不生效，故用 node 直写）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.nsis=j.build.nsis||{};j.build.nsis.warningsAsErrors=false;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # Linux 包标识与系统启动器显示名分别配置。
          npm pkg set build.deb.packageName="nuwax"
          npm pkg set build.rpm.packageName="nuwax"
          # 前端 dist 打包来源（基座已中立化移除该条目）：壳根 nuwax/dist →
          # resources/nuwax-dist（dev 形态运行时经 NUWAX_FRONTEND_DIST env 解析）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(e=>!(e.from&&e.from.includes('nuwax/dist'))).concat([{from:'../../../nuwax/dist',to:'nuwax-dist'}]);fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # 商业版已停用旧沙箱与 GUI/Windows MCP 方案，移除通用与 Windows 专用的资源打包条目。
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const legacy=new Set(['sandboxed-bash-mcp','sandboxed-fs-mcp','sandbox-runtime','sandbox-helper','agent-gui-server','windows-mcp']);for(const config of [j.build,j.build.win])if(config?.extraResources)config.extraResources=config.extraResources.filter(e=>!legacy.has(e.to));j.build.files=[...(Array.isArray(j.build.files)?j.build.files:j.build.files?[j.build.files]:['**/*']),'!node_modules/agent-gui-server/**/*','!node_modules/@nut-tree-fork/**/*'];fs.writeFileSync(p,JSON.stringify(j,null,2));"

      - name: Configure system application names
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/prepare-release-system-name.mjs

      - name: Configure short output directory for Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node scripts/configure-windows-output.mjs nuwa-electron-shell/crates/agent-electron-client/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
          package_json_file: nuwa-electron-shell/package.json

      - name: Stage pinned nuwax frontend dist
        shell: bash
        run: ./scripts/prepare-nuwax-dist.sh --pinned

      - name: Install setuptools for node-gyp (Python 3.12+)
        shell: bash
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev
          sudo gem install fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      # agent-kit 经根 package.json 的 pnpm.overrides file: 引用——install 会把它
      # 打包成快照拷入 node_modules；必须先构建出 dist 再 install，否则快照无入口
      - name: Build agent-kit (before install)
        shell: bash
        working-directory: nuwa-electron-shell
        run: |
          pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          pnpm -C crates/agent-kit run build

      # pnpm workspace 根在基座（nuwa-electron-shell/）内
      - name: Install workspace dependencies
        working-directory: nuwa-electron-shell
        run: pnpm install --filter @nuwax-ai/nuwaclaw... --filter '!agent-gui-server'

      - name: Rebuild native modules for Electron
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: npm run electron-rebuild

      - name: Install commercial dependencies
        run: node scripts/client/commercial-dependencies.mjs

      - name: Exercise Windows installer disk space with isolated fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\scripts\test-installer-space.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer disk space fixtures failed.' }

      - name: Restore bundled resource caches
        uses: ./.github/actions/bundled-resource-cache
        with:
          arch: ${{ matrix.arch }}

      - name: Prepare bundled resources (uv, node, git, nuwaxcode, ripgrep)
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          NUWAX_APP_IDENTIFIER: nuwax
        shell: bash
        run: node "$GITHUB_WORKSPACE/scripts/client/build-resource-artifacts.mjs" measure bundled -- npm run prepare:all
        timeout-minutes: 15

      - name: Publish reusable bundled download archives
        uses: ./.github/actions/bundled-resource-cache
        with:
          arch: ${{ matrix.arch }}
          operation: save

      - name: Setup Windows terminal compatibility compiler
        if: runner.os == 'Windows'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          cache-dependency-path: native/legacy-terminal/go.sum

      - name: Prepare Windows 10 1511 terminal compatibility resources
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/prepare-terminal-compat.mjs --platform win32 --arch "${{ matrix.arch }}"

      # Capture is a commercial resource: base prepare:all does not prepare it.
      # Use a native Intel runner for macOS x64, and an explicit MSYS2 toolchain
      # on Windows. The release helper installs the audited Winpthreads split
      # packages (fixed official archives, SHA256 and MSYS2 signatures).
      - name: Setup Linux capture compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm clang libdbus-1-dev libxkbcommon-dev libx11-dev libxi-dev libxtst-dev libxext-dev

      - name: Setup macOS capture compiler
        if: runner.os == 'macOS'
        run: |
          command -v nasm >/dev/null || brew install nasm
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Setup Windows capture compiler
        if: runner.os == 'Windows'
        id: capture-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            perl
            make
            diffutils
            curl

      - name: Restore unsigned native build caches
        uses: ./.github/actions/native-build-cache
        with:
          arch: ${{ matrix.arch }}
          msys2-location: ${{ steps.capture-msys2.outputs.msys2-location }}

      # ---- macOS：导入证书并配置公证（可选） ----
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not set, signing will be skipped"
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=actions
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "Apple notarization secrets not set, notarization will be skipped"
            exit 0
          fi
          if [ -z "${APPLE_ISSUER_ID:-}" ]; then
            echo "APPLE_ISSUER_ID required for notarization"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple-api-key"
          echo -n "$APPLE_API_KEY" | base64 --decode -o "$RUNNER_TEMP/apple-api-key/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_ISSUER_ID=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"

      # Import the signing certificate before finalizing capture's runtime SHA.
      # Builder skips only the already signed capture ffmpeg at its exact path.
      - name: Prepare and admit capture release resources
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          MSYS2_LOCATION: ${{ steps.capture-msys2.outputs.msys2-location }}
          # Only a real certificate enables pre-signing; unsigned QA keeps exact
          # source bytes. The helper never touches the verified source cache.
          NUWAX_CAPTURE_MAC_SIGNING: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE != '' && 'true' || 'false' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/client/build-resource-artifacts.mjs measure capture -- node scripts/prepare-release-capture.mjs --arch "$TARGET_ARCH"
        timeout-minutes: 30

      # ---- Computer Use helper（cua-driver 源码自建）：五平台全矩阵 ----
      # 与 release-electron-dev.yml 同款步骤（锁版+补丁+cargo+组装+预签 Developer ID）
      - name: Build Computer Use helper (cua-driver)
        shell: bash
        env:
          OUT_DIR: nuwa-electron-shell/crates/agent-electron-client/resources/computer-use
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          case "${{ runner.os }}/${{ matrix.arch }}" in
            macOS/arm64) TRIPLE=aarch64-apple-darwin ;;
            macOS/x64)   TRIPLE=x86_64-apple-darwin ;;
            Windows/x64) TRIPLE=x86_64-pc-windows-msvc ;;
            Linux/x64)   TRIPLE=x86_64-unknown-linux-gnu ;;
            Linux/arm64) TRIPLE=aarch64-unknown-linux-gnu ;;
            *) echo "::error::no cua target for ${{ runner.os }}/${{ matrix.arch }}"; exit 1 ;;
          esac
          export TARGET_TRIPLE="$TRIPLE"
          node scripts/client/build-resource-artifacts.mjs measure helper -- bash scripts/computer-use/build-helper.sh

      # extraResources 注入（目录随构建产出）
      - name: Publish reusable unsigned native resources
        uses: ./.github/actions/native-build-cache
        with:
          arch: ${{ matrix.arch }}
          msys2-location: ${{ steps.capture-msys2.outputs.msys2-location }}
          operation: save

      - name: Inject computer-use extraResources
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(e=>!(e.to&&e.to==='computer-use')).concat([{from:'resources/computer-use',to:'computer-use'}]);fs.writeFileSync(p,JSON.stringify(j,null,2));"
          test -d resources/computer-use && echo "computer-use extraResources injected: $(ls resources/computer-use)"

      - name: Configure commercial update package
        run: node scripts/prepare-release-updater.mjs

      - name: Exclude build caches from release payload
        run: node scripts/client/package-payload.mjs --package nuwa-electron-shell/crates/agent-electron-client/package.json

      - name: Clean previous build artifacts
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          rm -rf release node_modules/.cache
          echo "Cleaned release and cache directories"

      - name: Build Electron app
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SKIP_PREPARE: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 商业版品牌/端口注入（构建期经 esbuild/vite define 固化）：
          NUWAX_APP_IDENTIFIER: nuwax
          NUWAX_APP_DISPLAY_NAME: "女娲Nuwax"
          # 新安装默认正式业务域；esbuild 静态固化，不受安装机环境变量影响。
          NUWAX_RELEASE_CHANNEL: stable
          NUWAX_UPDATE_FEED_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com/nuwax-electron"
          # 官网下载页（MSI 等不支持自动更新的安装形态引导；商业暂无产品页先指官网首页）
          NUWAX_DOWNLOAD_PAGE_URL: "https://nuwax.com"
          NUWAX_PORT_OFFSET: "1000"
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            # dist:mac 显式使用 compression=maximum（ZIP level 9）；v3.0.3 的
            # macOS ZIP 阶段约 55 分钟。v3.0.6 改为 level 1 后该段约 5 分钟，
            # 但 DMG 包体也增加约 25%；后续应单独调优 ZIP 与 DMG。
            export ELECTRON_BUILDER_COMPRESSION_LEVEL=1
            echo "macOS archive compression level: ${ELECTRON_BUILDER_COMPRESSION_LEVEL}"
          fi
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "No Apple certificate, building unsigned Mac package for ${{ matrix.arch }}"
            npm run dist:mac:unsigned:${{ matrix.arch }} -- --publish never
          elif [ "${{ runner.os }}" = "macOS" ]; then
            echo "NUWAX_SIGNED_MAC_BUILD=1" >> "$GITHUB_ENV"
            APPLE_API_KEY= APPLE_API_KEY_ID= APPLE_ISSUER_ID= \
              npm run ${{ matrix.dist_cmd }} -- --dir --publish never --config.mac.notarize=false
          else
            npm run ${{ matrix.dist_cmd }} -- --publish never
          fi

      - name: Notarize signed macOS app with resumable retries
        if: runner.os == 'macOS' && env.NUWAX_SIGNED_MAC_BUILD == '1'
        timeout-minutes: 45
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node scripts/release-mac-notarization.mjs --arch "$TARGET_ARCH" --phase notarize

      - name: Package notarized macOS app
        if: runner.os == 'macOS' && env.NUWAX_SIGNED_MAC_BUILD == '1'
        timeout-minutes: 45
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"
        run: node scripts/release-mac-notarization.mjs --arch "$TARGET_ARCH" --phase package

      # Check the actual default runtime paths, not just builder configuration.
      # A missing encoder/record/notices prevents either Release or QA upload.
      - name: Verify packaged capture resources
        id: packaged_resources
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${BUILD_VERSION}"
          if [ "${{ runner.os }}" = Windows ]; then
            : "${NUWAX_WINDOWS_OUTPUT_DIR:?Short Windows output missing}"
            OUT_DIR="$NUWAX_WINDOWS_OUTPUT_DIR"
          fi
          node scripts/prepare-release-capture.mjs --arch "$TARGET_ARCH" --verify-output "$OUT_DIR"
          echo "output_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify packaged updater configuration
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          OUT_DIR: ${{ steps.packaged_resources.outputs.output_dir }}
        run: node scripts/prepare-release-updater.mjs --arch "$TARGET_ARCH" --verify-output "$OUT_DIR"

      - name: Verify packaged resources exclude build caches
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          OUT_DIR: ${{ steps.packaged_resources.outputs.output_dir }}
        run: node scripts/client/package-payload.mjs --verify-output "$OUT_DIR" --arch "$TARGET_ARCH"

      - name: Verify packaged Windows terminal compatibility resources
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          OUT_DIR: ${{ steps.packaged_resources.outputs.output_dir }}
        run: node scripts/prepare-terminal-compat.mjs --platform win32 --arch "$TARGET_ARCH" --verify-output "$OUT_DIR"

      - name: Record platform source and verify macOS signature
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          case "${{ runner.os }}" in macOS) PLATFORM=macos;; Windows) PLATFORM=windows;; Linux) PLATFORM=linux;; esac
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${VERSION}"
          if [ "$PLATFORM" = windows ]; then
            : "${NUWAX_WINDOWS_OUTPUT_DIR:?Short Windows output missing}"
            OUT_DIR="$NUWAX_WINDOWS_OUTPUT_DIR"
          fi
          if [ "$PLATFORM" = macos ]; then
            for value in APPLE_CERTIFICATE APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_KEY_ID APPLE_ISSUER_ID; do
              [ -n "${!value}" ] || { echo "::error::${value} is required for published macOS builds"; exit 1; }
            done
            APP_PATH="$(find "$OUT_DIR" -maxdepth 3 -type d -name Nuwax.app -print -quit)"
            [ -n "$APP_PATH" ] || { echo '::error::macOS app missing'; exit 1; }
            codesign --verify --deep --strict "$APP_PATH"
            spctl --assess --type execute --verbose "$APP_PATH"
            node scripts/prepare-release-system-name.mjs --verify-app "$APP_PATH"
            compgen -G "$OUT_DIR/*.dmg" >/dev/null || { echo '::error::macOS DMG missing'; exit 1; }
          fi
          node scripts/release-provenance.mjs record "${{ github.ref_name }}" "$PLATFORM" "${{ matrix.arch }}" "$OUT_DIR"

      - name: Upload artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${VERSION}"
          if [ "${{ runner.os }}" = Windows ]; then
            : "${NUWAX_WINDOWS_OUTPUT_DIR:?Short Windows output missing}"
            OUT_DIR="$NUWAX_WINDOWS_OUTPUT_DIR"
          fi
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Output directory not found: $OUT_DIR"
            exit 1
          fi
          for f in "${OUT_DIR}"/*; do
            [ -e "$f" ] || continue
            [ -f "$f" ] || continue
            # electron-builder 构建告警时写入输出目录的调试转储；不在 build-manifest/provenance
            # 资产清单内，上传会让最终镜像校验（Release 资产须被 provenance 全覆盖）必然失败。
            [ "$(basename "$f")" = "builder-debug.yml" ] && { echo "Skipping $(basename "$f") (builder debug dump)"; continue; }
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

      - name: Preserve signed macOS app after failure
        if: failure() && runner.os == 'macOS' && env.NUWAX_SIGNED_MAC_BUILD == '1'
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${BUILD_VERSION}"
          if [ -d "$OUT_DIR" ]; then
            tar -czf "$RUNNER_TEMP/mac-notary-recovery-${TARGET_ARCH}.tar.gz" -C "$OUT_DIR" .
          fi

      - name: Upload macOS recovery checkpoint
        if: failure() && runner.os == 'macOS' && env.NUWAX_SIGNED_MAC_BUILD == '1'
        uses: actions/upload-artifact@v4
        with:
          name: mac-notary-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac-notary-recovery-${{ matrix.arch }}.tar.gz
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
