# Nuwax 商业版 — Electron 客户端发布（薄壳编排）
#
# 本仓 = 商业产品壳：业务与构建系统在 nuwa-electron-shell/ submodule（基座仓
# nuwax-ai/nuwa-electron-shell 的 main 分支；2026-09-09 三层架构定型：
# 基座承载功能模块，产品壳注入身份并发布）。
# 构建/签名/上传逻辑与社区版 release-electron.yml 同构，差异集中在本文件头注：
#   1. checkout 用 submodules: true（非 recursive）：以 github.token 拉 submodule
#      （基座仓公开）；显式两层 init 见 Init submodules 步骤
#   2. nuwax 前端子模块（壳根 nuwax/，dist 随仓提交；基座 f68964eb 后不再内嵌前端）
#      第二层手动 init（远端公开可匿名拉取）
#   3. 所有 crates/ 路径前缀 nuwa-electron-shell/crates/；pnpm workspace 根在 nuwa-electron-shell/
#   4. 「Set version & commercial branding」步骤覆盖 appId/productName（npm pkg），
#      并删除 extendInfo.CFBundleIdentifier 旧覆盖使 macOS bundle id 与 appId 统一
#   5. 构建注入商业 env：NUWAX_APP_IDENTIFIER=nuwax（→ ~/.nuwax；历史目录迁移链
#      已被 overlay 覆写 migrate.ts 阻断，全新开始）、NUWAX_APP_DISPLAY_NAME、
#      NUWAX_UPDATE_FEED_BASE（独立更新通道 nuwax-electron）、NUWAX_PORT_OFFSET=1000
#      （端口整体 +1000，与社区版/nuwa-cli 同机错开）
#   6. Windows prepare 后显式断言沙箱 helper 产物存在（cargo 缺失时基座脚本只告警
#      不失败，这里兜底防止静默产出无沙箱包）
#
# Secrets（与社区版同值，共用证书）：
#   GH_PAT（可选）；APPLE_TEAM_ID / APPLE_SIGNING_IDENTITY / APPLE_CERTIFICATE /
#   APPLE_CERTIFICATE_PASSWORD / APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_ISSUER_ID；
#   MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY；OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
# Windows 签名不在 CI：本地 SimplySign 手签，见 docs/sign-windows.md

name: Release Electron App (Nuwax)

on:
  push:
    tags:
      - "electron-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. electron-v0.9.0)"
        required: true
        type: string
      channel:
        description: "Update channel pointer to publish (stable|beta). beta will NOT overwrite latest/latest.json"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#electron-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Nuwax release version: $VERSION"

      - name: Read release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes from $NOTES_FILE"
            cp "$NOTES_FILE" release_notes.txt
          else
            echo "女娲Nuwax ${VERSION}。请在 Assets 中下载对应平台安装包。" > release_notes.txt
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "女娲Nuwax (Electron) ${{ steps.version.outputs.version }}" \
              --notes-file release_notes.txt \
              --repo "$GITHUB_REPOSITORY"
            echo "Created release $TAG"
          fi

  build-electron:
    name: Build Electron (${{ matrix.platform }} ${{ matrix.arch }})
    needs: prepare
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: arm64
            dist_cmd: dist:mac:arm64
          - platform: macos-latest
            arch: x64
            dist_cmd: dist:mac:x64
          - platform: windows-latest
            arch: x64
            dist_cmd: dist:win
          - platform: ubuntu-24.04
            arch: x64
            dist_cmd: dist:linux:x64
          - platform: ubuntu-24.04-arm
            arch: arm64
            dist_cmd: dist:linux:arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 显式 submodule init（不依赖 checkout action 内部递归 sync）：
      # nuwa-electron-shell submodule → 基座仓 nuwax-ai/nuwa-electron-shell 的 main 分支（公开，
      #   github.token 注入凭据）；nuwax → 壳根前端 pin（公开可匿名拉取，gitlink 须在
      #   feat-dong.0930 上可达；基座已不含内嵌 nuwax——前端 dist 打包来源=壳根 nuwax/dist）
      - name: Init submodules (nuwa-electron-shell + nuwax)
        shell: bash
        env:
          GH_SUBMODULE_TOKEN: ${{ github.token }}
        run: |
          # submodule 认证统一走 gh CLI 凭据助手（跨平台一致；Windows Git 的
          # GCM 会劫持/覆盖 URL 内嵌凭据，insteadOf 亦不生效——均实测失败）
          export GH_TOKEN="${GH_SUBMODULE_TOKEN}"
          gh auth setup-git
          git submodule update --init nuwa-electron-shell
          git submodule update --init nuwax
          git submodule status
          # 强校验：submodule update 内部重试失败时可能以 0 退出（第三次 CI 实测假绿）
          test -d nuwa-electron-shell/crates/agent-electron-client || { echo "::error::nuwa-electron-shell submodule not checked out"; exit 1; }
          test -d nuwax/dist || { echo "::error::nuwax dist missing (shell root)"; exit 1; }

      # 商业自有代码整文件覆写进基座工作树（overlay/ 机制见 scripts/sync-overlay.js）
      - name: Sync overlay into base worktree
        shell: bash
        run: |
          node scripts/sync-overlay.js
          git -C nuwa-electron-shell status --short | head -40 || true

      - name: Set version & commercial branding in package.json
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          npm pkg set version="$VERSION"
          # 商业身份：文件名/包名一律 ASCII（productName=Nuwax → Nuwax.app /
          # Nuwax-Setup-*.exe 等；appId 尾段与注入 identifier 一致=nuwax）。
          # 面向用户的「显示名」与「文件名」分离：显示名走中文营销名 女娲Nuwax
          # （mac CFBundleDisplayName / win NSIS 向导+快捷方式 / linux desktop Name），
          # 文件名、包名、UA token、userData 目录名一律保持 ASCII Nuwax 不变。
          npm pkg set build.appId="com.nuwax-ai.nuwax"
          npm pkg set build.productName="Nuwax"
          # 顶层 productName：Electron app.getName() 优先读它——商业版更新调试信息与
          # 打包 userData 目录名显示 Nuwax 而非内部 scoped 包名（产物命名仍以 build.productName 为准）。
          # ⚠️ 必须保持 ASCII：autoUpdater 用 app.getName() 拼「Uninstall <name>.exe」
          # 定位 NSIS 卸载程序，与 NSIS 的 PRODUCT_FILENAME 同源，改中文会断更新链。
          npm pkg set productName="Nuwax"
          # 基座 mac.extendInfo 的 CFBundleName/DisplayName 是社区版展示名（女娲 Nuwax，
          # 带空格）；CFBundleIdentifier 删除以与 appId 统一。
          # CFBundleName 保持 ASCII（访达排序/兼容），CFBundleDisplayName 走中文营销名。
          npm pkg set build.mac.extendInfo.CFBundleName="Nuwax"
          npm pkg set build.mac.extendInfo.CFBundleDisplayName="女娲Nuwax"
          npm pkg delete build.mac.extendInfo.CFBundleIdentifier || true
          # win NSIS 快捷方式名（开始菜单/桌面）；向导标题与正文由 overlay 的
          # build/installer.nsh customHeader 宏覆写 Name（底部 BrandingText 仍为 Nuwax <ver>）
          npm pkg set build.nsis.shortcutName="女娲Nuwax"
          # installer.nsh 的二次 Name 覆写触发 NSIS warning 6029（Name specified
          # multiple times），electron-builder 默认 -WX 把 warning 当 error 直接炸掉
          # makensis（v1.0.5 win 实证）。6029 仅"浪费空间"无实害，须写入真布尔
          # false 关掉（app-builder-lib NsisTarget 是 === false 严格判断，
          # npm pkg set 会写成字符串 "false" 不生效，故用 node 直写）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.nsis=j.build.nsis||{};j.build.nsis.warningsAsErrors=false;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          # linux 安装包内部包名（基座默认为社区标识 nuwaclaw）；desktop entry Name
          # 覆盖 productName 派生的默认显示名，包名/文件名不受影响
          npm pkg set build.deb.packageName="nuwax"
          npm pkg set build.rpm.packageName="nuwax"
          npm pkg set build.linux.desktop.entry.Name="女娲Nuwax"
          # 前端 dist 打包来源（基座已中立化移除该条目）：壳根 nuwax/dist →
          # resources/nuwax-dist（dev 形态运行时经 NUWAX_FRONTEND_DIST env 解析）
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.build.extraResources=(j.build.extraResources||[]).filter(e=>!(e.from&&e.from.includes('nuwax/dist'))).concat([{from:'../../../nuwax/dist',to:'nuwax-dist'}]);fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "package.json version: $(npm pkg get version), appId: $(npm pkg get build.appId), productName: $(npm pkg get build.productName), extraResources(nuwax-dist): $(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).build.extraResources.filter(e=>e.to==='nuwax-dist').map(e=>e.from).join(','))")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Install setuptools for node-gyp (Python 3.12+)
        shell: bash
        run: python3 -m pip install setuptools --break-system-packages 2>/dev/null || python3 -m pip install setuptools

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev
          sudo gem install fpm
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      # agent-kit 经根 package.json 的 pnpm.overrides file: 引用——install 会把它
      # 打包成快照拷入 node_modules；必须先构建出 dist 再 install，否则快照无入口
      - name: Build agent-kit (before install)
        shell: bash
        working-directory: nuwa-electron-shell
        run: |
          pnpm -C crates/agent-kit install --ignore-workspace --prefer-offline
          pnpm -C crates/agent-kit run build

      # pnpm workspace 根在基座（nuwa-electron-shell/）内
      - name: Install workspace dependencies
        working-directory: nuwa-electron-shell
        run: pnpm install --filter @nuwax-ai/nuwaclaw...

      - name: Rebuild native modules for Electron
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: npm run electron-rebuild

      - name: Cache bundled Node.js
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/node
          key: bundled-node-24-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/package.json') }}

      - name: Cache bundled Git (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/git
          key: bundled-git-2.47.1-windows-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/package.json') }}

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/uv
          key: bundled-uv-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-uv.js') }}

      - name: Cache nuwaxcode
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/nuwaxcode
          key: bundled-nuwaxcode-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-nuwaxcode.js') }}

      - name: Cache ripgrep
        uses: actions/cache@v4
        with:
          path: nuwa-electron-shell/crates/agent-electron-client/resources/ripgrep
          key: bundled-ripgrep-v1-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('nuwa-electron-shell/crates/agent-electron-client/scripts/prepare/prepare-ripgrep.js') }}

      - name: Prepare bundled resources (uv, node, git, nuwaxcode, ripgrep)
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
        run: npm run prepare:all
        timeout-minutes: 15

      # 基座脚本在 rustc 缺失时只告警不失败——这里兜底断言，防止静默产出无沙箱 helper 的包
      - name: Assert sandbox helper built (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          if [ ! -f resources/sandbox-helper/nuwax-sandbox-helper.exe ]; then
            echo "::error::sandbox helper missing (resources/sandbox-helper/nuwax-sandbox-helper.exe) — runner rust toolchain broken?"
            exit 1
          fi
          echo "sandbox helper OK"

      # ---- macOS：导入证书并配置公证（可选） ----
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "APPLE_CERTIFICATE not set, signing will be skipped"
            exit 0
          fi
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=actions
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare Apple notarization key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          if [ -z "${APPLE_API_KEY:-}" ] || [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "Apple notarization secrets not set, notarization will be skipped"
            exit 0
          fi
          if [ -z "${APPLE_ISSUER_ID:-}" ]; then
            echo "APPLE_ISSUER_ID required for notarization"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/apple-api-key"
          echo -n "$APPLE_API_KEY" | base64 --decode -o "$RUNNER_TEMP/apple-api-key/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"
          echo "APPLE_ISSUER_ID=$APPLE_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Clean previous build artifacts
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        run: |
          rm -rf release node_modules/.cache
          echo "Cleaned release and cache directories"

      - name: Build Electron app
        shell: bash
        working-directory: nuwa-electron-shell/crates/agent-electron-client
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          SKIP_PREPARE: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 商业版品牌/端口注入（构建期经 esbuild/vite define 固化）：
          NUWAX_APP_IDENTIFIER: nuwax
          NUWAX_APP_DISPLAY_NAME: "Nuwax"
          NUWAX_UPDATE_FEED_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com/nuwax-electron"
          NUWAX_PORT_OFFSET: "1000"
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "No Apple certificate, building unsigned Mac package for ${{ matrix.arch }}"
            npm run dist:mac:unsigned:${{ matrix.arch }} -- --publish never
          else
            npm run ${{ matrix.dist_cmd }} -- --publish never
          fi

      - name: Upload artifacts to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          OUT_DIR="nuwa-electron-shell/crates/agent-electron-client/release/${VERSION}"
          if [ ! -d "$OUT_DIR" ]; then
            echo "::error::Output directory not found: $OUT_DIR"
            exit 1
          fi
          for f in "${OUT_DIR}"/*; do
            [ -e "$f" ] || continue
            [ -f "$f" ] || continue
            echo "Uploading $(basename "$f") ..."
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done

  # ==================== 同步到 MinIO S3（构建产物）和阿里云 OSS（latest.json） ====================
  # 手动触发：workflow_dispatch 输入 tag（如 electron-v0.8.0）；独立入口 sync-electron-to-oss.yml
  sync-to-minio:
    name: Sync release to MinIO S3 & OSS
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      S3_ENDPOINT: "https://s3.nuwax.com:9443"
      S3_REGION: "us-east-1"
      S3_BUCKET: "nuwaclaw"
      S3_CDN_BASE: "https://s3.nuwax.com:9443/nuwaclaw"
      OSS_ENDPOINT: "https://oss-rg-china-mainland.aliyuncs.com"
      OSS_REGION: "rg-china-mainland"
      OSS_BUCKET: "oss://nuwa-packages"
      OSS_CDN_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com"
      # 商业版发布通道（与客户端 NUWAX_UPDATE_FEED_BASE 对应，勿与社区版 nuwaclaw-electron 混用）
      RELEASE_ROOT: "nuwax-electron"
      PRODUCT_PREFIX: "Nuwax"
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
    steps:
      - name: Ensure awscli v2 (for S3)
        run: |
          if aws --version 2>/dev/null; then
            echo "AWS CLI already installed"
          else
            curl -fSL -o /tmp/awscliv2.zip \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --bin-dir /usr/local/bin
          fi
          aws --version

      - name: Install ossutil v2 (for latest.json)
        run: |
          curl -fSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Configure AWS credentials for S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$S3_REGION"
          aws configure set default.s3.addressing_style path
          aws configure set endpoint_url "$S3_ENDPOINT"

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets
          echo "==> Downloaded assets:"
          ls -lh /tmp/release-assets/

      - name: Generate latest.json and platform yml from assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [[ "$TAG" == prerelease-v* ]]; then
            VERSION="${TAG#prerelease-v}"
            WIN_EXE="${PRODUCT_PREFIX}-Setup-${VERSION}-unsigned.exe"
            WIN_MSI="${PRODUCT_PREFIX}-${VERSION}-unsigned.msi"
          else
            VERSION="${TAG#electron-v}"
            WIN_EXE="${PRODUCT_PREFIX}.Setup.${VERSION}.exe"
            WIN_MSI="${PRODUCT_PREFIX}.${VERSION}.msi"
          fi
          if [[ "$TAG" == prerelease-v* ]] || [ "$CHANNEL" = "beta" ]; then
            S3_URL_PREFIX="${S3_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}"
          else
            S3_URL_PREFIX="${S3_CDN_BASE}/${RELEASE_ROOT}/${TAG}"
          fi
          ASSETS_DIR="/tmp/release-assets"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '${VERSION}'. MVP only supports numeric x.y.z"
            exit 1
          fi

          if [ "$CHANNEL" != "stable" ] && [ "$CHANNEL" != "beta" ]; then
            echo "::error::Invalid channel '${CHANNEL}', expected stable or beta"
            exit 1
          fi

          rm -f "${ASSETS_DIR}"/*.yml

          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,createdAt 2>/dev/null || echo '{}')
          NOTES=$(echo "$RELEASE_JSON" | jq -r '.body // "女娲Nuwax 功能优化和问题修复。建议更新到最新版本以获得更好的体验。"' | head -c 2000)
          PUB_DATE=$(echo "$RELEASE_JSON" | jq -r '.createdAt // empty')
          if [ -z "$PUB_DATE" ]; then
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          fi

          add_platform() {
            local key="$1" file="$2"
            local filepath="${ASSETS_DIR}/${file}"
            if [ -f "$filepath" ]; then
              local sig size
              sig=$(sha512sum "$filepath" | awk '{print $1}' | xxd -r -p | base64 -w0)
              if [ -z "$sig" ]; then
                echo "  Skipped: ${key} -> ${file} (signature generation failed)"
                return 0
              fi
              size=$(stat -c%s "$filepath" 2>/dev/null || stat -f%z "$filepath")
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg k "$key" \
                --arg u "${S3_URL_PREFIX}/${file}" \
                --arg s "$sig" \
                --argjson sz "$size" \
                '. + {($k): {"url": $u, "signature": $s, "size": $sz}}')
              echo "  Added: ${key} -> ${file} (${size} bytes)"
            fi
          }

          PLATFORMS="{}"
          echo "==> Scanning release assets for platforms..."
          add_platform "darwin-aarch64"     "${PRODUCT_PREFIX}-${VERSION}-arm64.dmg"
          add_platform "darwin-aarch64-zip" "${PRODUCT_PREFIX}-${VERSION}-arm64-mac.zip"
          add_platform "darwin-x86_64"      "${PRODUCT_PREFIX}-${VERSION}.dmg"
          add_platform "darwin-x86_64-zip"  "${PRODUCT_PREFIX}-${VERSION}-mac.zip"
          add_platform "windows-x86_64"      "$WIN_EXE"
          add_platform "windows-x86_64-nsis" "$WIN_EXE"
          add_platform "windows-x86_64-msi"  "$WIN_MSI"
          add_platform "linux-x86_64"          "${PRODUCT_PREFIX}-${VERSION}.AppImage"
          add_platform "linux-x86_64-appimage" "${PRODUCT_PREFIX}-${VERSION}.AppImage"
          add_platform "linux-x86_64-deb"      "${PRODUCT_PREFIX}-${VERSION}-amd64.deb"
          add_platform "linux-x86_64-rpm"      "${PRODUCT_PREFIX}-${VERSION}-x86_64.rpm"
          add_platform "linux-aarch64"          "${PRODUCT_PREFIX}-${VERSION}-arm64.AppImage"
          add_platform "linux-aarch64-appimage" "${PRODUCT_PREFIX}-${VERSION}-arm64.AppImage"
          add_platform "linux-aarch64-deb"      "${PRODUCT_PREFIX}-${VERSION}-arm64.deb"
          add_platform "linux-aarch64-rpm"      "${PRODUCT_PREFIX}-${VERSION}-aarch64.rpm"

          if [ "$(echo "$PLATFORMS" | jq 'length')" = "0" ]; then
            echo "::warning::No exact filename matches, falling back to fuzzy scan"
            for file in "${ASSETS_DIR}"/*; do
              filename=$(basename "$file")
              case "$filename" in
                *.dmg|*.zip|*.exe|*.msi|*.AppImage|*.deb|*.rpm)
                  key=""
                  case "$filename" in
                    *arm64*mac*|*arm64*.dmg)  key="darwin-aarch64" ;;
                    *x64*mac*|*x64*.dmg)      key="darwin-x86_64" ;;
                    *Setup*.exe|*setup*.exe)   key="windows-x86_64" ;;
                    *.msi)                     key="windows-x86_64-msi" ;;
                    *arm64*.AppImage)          key="linux-aarch64" ;;
                    *amd64*.AppImage|*x64*.AppImage|*.AppImage) key="linux-x86_64" ;;
                    *arm64*.deb)               key="linux-aarch64-deb" ;;
                    *amd64*.deb|*x64*.deb)     key="linux-x86_64-deb" ;;
                    *aarch64*.rpm)             key="linux-aarch64-rpm" ;;
                    *x86_64*.rpm|*x64*.rpm)   key="linux-x86_64-rpm" ;;
                  esac
                  [ -n "$key" ] && add_platform "$key" "$filename"
                  ;;
              esac
            done
          fi

          blockmap_size_for() {
            local installer="$1"
            local bm="${ASSETS_DIR}/${installer}.blockmap"
            if [ -f "$bm" ]; then
              stat -c%s "$bm" 2>/dev/null || stat -f%z "$bm"
            fi
          }

          gen_yml() {
            local channel="$1"
            local keys="$2"
            local first_key first_file blockmap_size k fname sig size bms
            first_key=$(echo "$PLATFORMS" | jq -r --argjson keys "$keys" 'limit(1; $keys[] as $k | select(.[$k] != null) | $k)')
            [ -z "$first_key" ] || [ "$first_key" = "null" ] && return 0
            first_file=$(echo "$PLATFORMS" | jq -r --arg k "$first_key" '.[$k].url' | sed 's|.*/||')
            blockmap_size=$(blockmap_size_for "$first_file")
            {
              echo "version: $VERSION"
              echo "path: $first_file"
              echo "sha512: $(echo "$PLATFORMS" | jq -r --arg k "$first_key" '.[$k].signature')"
              echo "releaseDate: $PUB_DATE"
              if [ -n "$blockmap_size" ]; then
                echo "blockMapSize: $blockmap_size"
              fi
              echo "files:"
              while IFS= read -r k; do
                fname=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].url' | sed 's|.*/||')
                sig=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].signature')
                size=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].size')
                echo "  - url: $fname"
                echo "    sha512: $sig"
                echo "    size: $size"
                bms=$(blockmap_size_for "$fname")
                if [ -n "$bms" ]; then
                  echo "    blockMapSize: $bms"
                fi
              done < <(echo "$PLATFORMS" | jq -r --argjson keys "$keys" '$keys[] as $k | select(.[$k] != null) | $k')
            } > "${ASSETS_DIR}/${channel}.yml"
            echo "  Generated ${channel}.yml (primary: $first_file)"
          }
          DARWIN_KEYS='["darwin-aarch64-zip","darwin-x86_64-zip","darwin-aarch64","darwin-x86_64"]'
          LINUX_KEYS='["linux-x86_64-appimage","linux-aarch64-appimage","linux-x86_64","linux-aarch64","linux-x86_64-deb","linux-aarch64-deb","linux-x86_64-rpm","linux-aarch64-rpm"]'
          LINUX_ARM64_KEYS='["linux-aarch64-appimage","linux-aarch64","linux-aarch64-deb","linux-aarch64-rpm"]'
          LINUX_X64_KEYS='["linux-x86_64-appimage","linux-x86_64","linux-x86_64-deb","linux-x86_64-rpm"]'
          WIN_KEYS='["windows-x86_64","windows-x86_64-nsis","windows-x86_64-msi"]'
          gen_yml "latest-mac" "$DARWIN_KEYS"
          gen_yml "latest-linux" "$LINUX_KEYS"
          gen_yml "latest-linux-arm64" "$LINUX_ARM64_KEYS"
          gen_yml "latest-linux-x64" "$LINUX_X64_KEYS"
          gen_yml "latest" "$WIN_KEYS"
          echo "==> Platform yml written to ${ASSETS_DIR}"

          YML_URLS=$(jq -n \
            --arg darwin "${S3_URL_PREFIX}/latest-mac.yml" \
            --arg linux "${S3_URL_PREFIX}/latest-linux.yml" \
            --arg win "${S3_URL_PREFIX}/latest.yml" \
            '{darwin: $darwin, linux: $linux, win: $win}')

          LATEST_JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            --argjson yml "$YML_URLS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms, yml: $yml}')
          echo "$LATEST_JSON" > /tmp/latest.json
          echo "==> Generated latest.json"
          echo "$LATEST_JSON" | jq .

      - name: Upload full release to MinIO S3 (installers, yml, latest.json)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [[ "$TAG" == prerelease-v* ]] || [ "$CHANNEL" = "beta" ]; then
            S3_PREFIX="${RELEASE_ROOT}/beta-build/${TAG}"
          else
            S3_PREFIX="${RELEASE_ROOT}/${TAG}"
          fi

          echo "==> MinIO: (1/3) installers and other non-yml release assets"
          for file in /tmp/release-assets/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in *.yml) continue ;; esac
            filename=$(basename "$file")
            echo "Uploading to S3: ${filename}"
            aws s3 cp "$file" "s3://${S3_BUCKET}/${S3_PREFIX}/${filename}" \
              --endpoint-url "$S3_ENDPOINT"
          done

          echo "==> MinIO: (2/3) platform yml"
          shopt -s nullglob
          for file in /tmp/release-assets/*.yml; do
            filename=$(basename "$file")
            echo "Uploading to S3: ${filename}"
            aws s3 cp "$file" "s3://${S3_BUCKET}/${S3_PREFIX}/${filename}" \
              --endpoint-url "$S3_ENDPOINT"
          done
          shopt -u nullglob

          echo "==> MinIO: (3/3) latest.json (versioned + channel pointer)"
          aws s3 cp /tmp/latest.json "s3://${S3_BUCKET}/${S3_PREFIX}/latest.json" \
            --endpoint-url "$S3_ENDPOINT"
          if [ "$CHANNEL" = "stable" ]; then
            aws s3 cp /tmp/latest.json "s3://${S3_BUCKET}/${RELEASE_ROOT}/latest/latest.json" \
              --endpoint-url "$S3_ENDPOINT"
          else
            aws s3 cp /tmp/latest.json "s3://${S3_BUCKET}/${RELEASE_ROOT}/beta/latest.json" \
              --endpoint-url "$S3_ENDPOINT"
          fi

      - name: Verify S3 upload
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "beta" ]; then
            VERIFY_URL="${S3_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}/latest-mac.yml"
          else
            VERIFY_URL="${S3_CDN_BASE}/${RELEASE_ROOT}/${TAG}/latest-mac.yml"
          fi
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$VERIFY_URL")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "==> S3 upload verified: latest-mac.yml (HTTP ${HTTP_STATUS})"
          else
            echo "::error::S3 upload verification failed: latest-mac.yml (HTTP ${HTTP_STATUS})"
            exit 1
          fi

      - name: Upload platform yml and latest.json to Alibaba OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "beta" ]; then
            OSS_VERSION_PREFIX="${OSS_BUCKET}/${RELEASE_ROOT}/beta-build/${TAG}"
          else
            OSS_VERSION_PREFIX="${OSS_BUCKET}/${RELEASE_ROOT}/${TAG}"
          fi
          echo "==> Publishing yml + latest.json to OSS (no installers) for channel: ${CHANNEL}"

          shopt -s nullglob
          for file in /tmp/release-assets/*.yml; do
            filename=$(basename "$file")
            echo "Uploading to OSS: ${filename}"
            ossutil cp --force "$file" "${OSS_VERSION_PREFIX}/${filename}" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          done
          shopt -u nullglob

          ossutil cp --force /tmp/latest.json "${OSS_VERSION_PREFIX}/latest.json" \
            --endpoint "$OSS_ENDPOINT" \
            --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET"

          if [ "$CHANNEL" = "stable" ]; then
            ossutil cp --force /tmp/latest.json "${OSS_BUCKET}/${RELEASE_ROOT}/latest/latest.json" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
            echo "==> Uploaded latest.json to stable pointer: latest/latest.json"
          else
            ossutil cp --force /tmp/latest.json "${OSS_BUCKET}/${RELEASE_ROOT}/beta/latest.json" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
            echo "==> Uploaded latest.json to beta pointer: beta/latest.json (stable pointer untouched)"
          fi

      - name: Verify OSS upload
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "stable" ]; then
            VERIFY_JSON_URL="${OSS_CDN_BASE}/${RELEASE_ROOT}/latest/latest.json"
            VERIFY_YML_URL="${OSS_CDN_BASE}/${RELEASE_ROOT}/${TAG}/latest-mac.yml"
          else
            VERIFY_JSON_URL="${OSS_CDN_BASE}/${RELEASE_ROOT}/beta/latest.json"
            VERIFY_YML_URL="${OSS_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}/latest-mac.yml"
          fi
          HTTP_JSON=$(curl -sS -o /tmp/oss-latest.json -w "%{http_code}" "$VERIFY_JSON_URL")
          if [ "$HTTP_JSON" = "200" ]; then
            echo "==> latest.json (${CHANNEL} pointer): OK (HTTP ${HTTP_JSON})"
            cat /tmp/oss-latest.json | jq .
          else
            echo "::error::latest.json for channel '${CHANNEL}' not found on OSS (HTTP ${HTTP_JSON})"
            exit 1
          fi
          HTTP_YML=$(curl -sS -o /dev/null -w "%{http_code}" "$VERIFY_YML_URL")
          if [ "$HTTP_YML" = "200" ]; then
            echo "==> Versioned OSS latest-mac.yml: OK (HTTP ${HTTP_YML}) [$VERIFY_YML_URL]"
          else
            echo "::error::OSS versioned latest-mac.yml verification failed (HTTP ${HTTP_YML}) [$VERIFY_YML_URL]"
            exit 1
          fi
