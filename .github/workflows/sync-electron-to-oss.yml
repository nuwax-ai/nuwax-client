# Nuwax 商业版 — 仅同步：将指定 tag 的 GitHub Release 资产同步到 MinIO S3 与阿里云 OSS。
# MinIO：完整资产；OSS：仅元数据（*.yml + latest.json）。版本目录先上传、核对，
# 最后才更新通道指针：beta 在五平台构建成功后通过 workflow_call 自动执行，
# stable 在正式版 Windows 签名后单独 dispatch；两者均可手动重试。
# 通道：nuwax-electron/（与社区版 nuwaclaw-electron 隔离）。
#
# Secrets：GH_PAT（或 repo token）、MINIO_ACCESS_KEY_ID、MINIO_SECRET_ACCESS_KEY、OSS_ACCESS_KEY_ID、OSS_ACCESS_KEY_SECRET

name: Sync Electron Release to MinIO S3 & OSS (Nuwax)
run-name: Sync ${{ inputs.channel }} ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      channel:
        required: true
        type: string
    secrets:
      GH_PAT:
        required: false
      MINIO_ACCESS_KEY_ID:
        required: true
      MINIO_SECRET_ACCESS_KEY:
        required: true
      OSS_ACCESS_KEY_ID:
        required: true
      OSS_ACCESS_KEY_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync (e.g. electron-v0.9.0)"
        required: true
        type: string
      channel:
        description: "Update channel pointer to publish (stable|beta). beta will NOT overwrite latest/latest.json"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta

permissions:
  actions: read
  contents: write

concurrency:
  group: nuwax-update-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  sync-to-minio:
    name: Sync release to MinIO S3 & OSS
    runs-on: ubuntu-latest
    env:
      S3_ENDPOINT: "https://s3.nuwax.com:9443"
      S3_REGION: "us-east-1"
      S3_BUCKET: "nuwaclaw"
      S3_CDN_BASE: "https://s3.nuwax.com:9443/nuwaclaw"
      OSS_ENDPOINT: "https://oss-rg-china-mainland.aliyuncs.com"
      OSS_REGION: "rg-china-mainland"
      OSS_BUCKET: "oss://nuwa-packages"
      OSS_CDN_BASE: "https://nuwa-packages.oss-rg-china-mainland.aliyuncs.com"
      # 商业版发布通道（与客户端 NUWAX_UPDATE_FEED_BASE 对应，勿与社区版 nuwaclaw-electron 混用）
      RELEASE_ROOT: "nuwax-electron"
      PRODUCT_PREFIX: "Nuwax"
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}
    steps:
      - name: Validate release tag and channel
        run: |
          if [[ "$RELEASE_TAG" =~ ^electron-v[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_CHANNEL" == stable ]]; then
            exit 0
          fi
          if [[ "$RELEASE_TAG" =~ ^prerelease-v[0-9]+\.[0-9]+\.[0-9]+$ && "$RELEASE_CHANNEL" == beta ]]; then
            exit 0
          fi
          echo "::error::electron-v* 只能发布 stable，prerelease-v* 只能发布 beta，版本须为 x.y.z"
          exit 1

      - name: Checkout release source for provenance verification
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Verify release state and successful build
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease)"
          echo "$RELEASE_JSON" | jq -e --arg tag "$RELEASE_TAG" --arg channel "$RELEASE_CHANNEL" '
            .tagName == $tag and
            (if $channel == "beta" then .isPrerelease == true
             else .isPrerelease == false end)
          ' >/dev/null || {
            echo "::error::${RELEASE_TAG} 的 Release 状态不匹配 ${RELEASE_CHANNEL} 通道"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # workflow_call 保留调用方的 push/tag 上下文。调用方 publish-beta
            # 明确 needs: build-electron；此时整条 run 尚未 completed。
            [ "$RELEASE_CHANNEL" = beta ] &&
              [ "$GITHUB_REF" = "refs/tags/${RELEASE_TAG}" ] &&
              [ "$GITHUB_SHA" = "$(git rev-parse HEAD)" ] || {
                echo "::error::自动 beta 同步必须来自相同 tag/SHA 的构建工作流"
                exit 1
              }
          else
            # workflow_dispatch 重试没有 needs 依赖，必须查成功完成的构建 run。
            if [ "$RELEASE_CHANNEL" = beta ]; then
              BUILD_WORKFLOW=release-electron-dev.yml
            else
              BUILD_WORKFLOW=release-electron.yml
            fi
            BUILD_RUNS="$(gh run list --workflow "$BUILD_WORKFLOW" --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json databaseId,headBranch,headSha,event,status,conclusion)"
            if [ "$RELEASE_CHANNEL" = beta ]; then
              # 自动同步失败会使整个 prerelease run 标红；手动重试只要求
              # 前置源码门禁及五个平台 build job 都成功（矩阵 job 依赖 prepare/verify-source）。
              BUILD_RUN_ID="$(echo "$BUILD_RUNS" | jq -r --arg tag "$RELEASE_TAG" --arg sha "$(git rev-parse HEAD)" '
                first(.[] | select(.headBranch == $tag and .headSha == $sha and .event == "push") | .databaseId) // empty')"
              [ -n "$BUILD_RUN_ID" ] || { echo "::error::${RELEASE_TAG} 没有对应的构建 run"; exit 1; }
              gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs | jq -e '
                .jobs as $jobs |
                ["Build Electron (macos-latest arm64)",
                 "Build Electron (macos-latest x64)",
                 "Build Electron (windows-latest x64)",
                 "Build Electron (ubuntu-24.04 x64)",
                 "Build Electron (ubuntu-24.04-arm arm64)"] |
                all(.[]; . as $name | any($jobs[]; .name == $name and
                  .status == "completed" and .conclusion == "success"))
              ' >/dev/null || {
                echo "::error::${RELEASE_TAG} 的五个平台构建没有全部成功（run ${BUILD_RUN_ID}）"
                exit 1
              }
            else
              echo "$BUILD_RUNS" | jq -e --arg tag "$RELEASE_TAG" --arg sha "$(git rev-parse HEAD)" '
                any(.[]; .headBranch == $tag and .headSha == $sha and .event == "push" and
                  .status == "completed" and .conclusion == "success")
              ' >/dev/null || {
                echo "::error::${RELEASE_TAG} 没有同一源码提交的成功正式版构建"
                exit 1
              }
            fi
          fi

      - name: Ensure awscli v2 (for S3)
        run: |
          if aws --version 2>/dev/null; then
            echo "AWS CLI already installed"
          else
            curl -fSL -o /tmp/awscliv2.zip \
              "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install --bin-dir /usr/local/bin
          fi
          aws --version

      - name: Install ossutil v2 (for latest.json)
        run: |
          curl -fSL -o /tmp/ossutil.zip \
            "https://gosspublic.alicdn.com/ossutil/v2/2.2.0/ossutil-2.2.0-linux-amd64.zip"
          unzip -q /tmp/ossutil.zip -d /tmp
          sudo mv /tmp/ossutil-2.2.0-linux-amd64/ossutil /usr/local/bin/
          ossutil version

      - name: Configure AWS credentials for S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          aws configure set default.region "$S3_REGION"
          aws configure set default.s3.addressing_style path
          aws configure set endpoint_url "$S3_ENDPOINT"

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          mkdir -p /tmp/release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir /tmp/release-assets
          echo "==> Downloaded assets:"
          ls -lh /tmp/release-assets/

      - name: Generate latest.json and platform yml from assets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [[ "$TAG" == prerelease-v* ]]; then
            VERSION="${TAG#prerelease-v}"
          else
            VERSION="${TAG#electron-v}"
          fi
          if [ "$CHANNEL" = beta ]; then
            WIN_EXE="${PRODUCT_PREFIX}-Setup-${VERSION}-unsigned.exe"
          else
            WIN_EXE="${PRODUCT_PREFIX}.Setup.${VERSION}.exe"
          fi
          if [[ "$TAG" == prerelease-v* ]] || [ "$CHANNEL" = "beta" ]; then
            S3_URL_PREFIX="${S3_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}"
          else
            S3_URL_PREFIX="${S3_CDN_BASE}/${RELEASE_ROOT}/${TAG}"
          fi
          ASSETS_DIR="/tmp/release-assets"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version '${VERSION}'. MVP only supports numeric x.y.z"
            exit 1
          fi

          if [ "$CHANNEL" != "stable" ] && [ "$CHANNEL" != "beta" ]; then
            echo "::error::Invalid channel '${CHANNEL}', expected stable or beta"
            exit 1
          fi

          rm -f "${ASSETS_DIR}"/*.yml

          RELEASE_JSON=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,createdAt 2>/dev/null || echo '{}')
          NOTES=$(echo "$RELEASE_JSON" | jq -r '.body // "女娲Nuwax 功能优化和问题修复。建议更新到最新版本以获得更好的体验。"' | head -c 500)
          PUB_DATE=$(echo "$RELEASE_JSON" | jq -r '.createdAt // empty')
          if [ -z "$PUB_DATE" ]; then
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          fi

          add_platform() {
            local key="$1" file="$2"
            local filepath="${ASSETS_DIR}/${file}"
            if [ -f "$filepath" ]; then
              local sig size
              sig=$(sha512sum "$filepath" | awk '{print $1}' | xxd -r -p | base64 -w0)
              if [ -z "$sig" ]; then
                echo "  Skipped: ${key} -> ${file} (signature generation failed)"
                return 0
              fi
              size=$(stat -c%s "$filepath" 2>/dev/null || stat -f%z "$filepath")
              PLATFORMS=$(echo "$PLATFORMS" | jq \
                --arg k "$key" \
                --arg u "${S3_URL_PREFIX}/${file}" \
                --arg s "$sig" \
                --argjson sz "$size" \
                '. + {($k): {"url": $u, "signature": $s, "size": $sz}}')
              echo "  Added: ${key} -> ${file} (${size} bytes)"
            fi
          }

          PLATFORMS="{}"
          echo "==> Scanning release assets for platforms..."
          add_platform "darwin-aarch64"     "${PRODUCT_PREFIX}-${VERSION}-arm64.dmg"
          add_platform "darwin-aarch64-zip" "${PRODUCT_PREFIX}-${VERSION}-arm64-mac.zip"
          add_platform "darwin-x86_64"      "${PRODUCT_PREFIX}-${VERSION}.dmg"
          add_platform "darwin-x86_64-zip"  "${PRODUCT_PREFIX}-${VERSION}-mac.zip"
          add_platform "windows-x86_64"      "$WIN_EXE"
          add_platform "windows-x86_64-nsis" "$WIN_EXE"
          # MSI 当前未签名，不进入自动更新指针；仍可留在 Release 供内部检查。
          add_platform "linux-x86_64"          "${PRODUCT_PREFIX}-${VERSION}.AppImage"
          add_platform "linux-x86_64-appimage" "${PRODUCT_PREFIX}-${VERSION}.AppImage"
          add_platform "linux-x86_64-deb"      "${PRODUCT_PREFIX}-${VERSION}-amd64.deb"
          add_platform "linux-x86_64-rpm"      "${PRODUCT_PREFIX}-${VERSION}-x86_64.rpm"
          add_platform "linux-aarch64"          "${PRODUCT_PREFIX}-${VERSION}-arm64.AppImage"
          add_platform "linux-aarch64-appimage" "${PRODUCT_PREFIX}-${VERSION}-arm64.AppImage"
          add_platform "linux-aarch64-deb"      "${PRODUCT_PREFIX}-${VERSION}-arm64.deb"
          add_platform "linux-aarch64-rpm"      "${PRODUCT_PREFIX}-${VERSION}-aarch64.rpm"

          for key in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64 linux-aarch64; do
            echo "$PLATFORMS" | jq -e --arg key "$key" '.[$key].url | strings' >/dev/null \
              || { echo "::error::缺少精确命名的更新资产: $key"; exit 1; }
          done

          blockmap_size_for() {
            local installer="$1"
            local bm="${ASSETS_DIR}/${installer}.blockmap"
            if [ -f "$bm" ]; then
              stat -c%s "$bm" 2>/dev/null || stat -f%z "$bm"
            fi
          }

          gen_yml() {
            local channel="$1"
            local keys="$2"
            local first_key first_file blockmap_size k fname sig size bms
            first_key=$(echo "$PLATFORMS" | jq -r --argjson keys "$keys" 'limit(1; $keys[] as $k | select(.[$k] != null) | $k)')
            [ -z "$first_key" ] || [ "$first_key" = "null" ] && return 0
            first_file=$(echo "$PLATFORMS" | jq -r --arg k "$first_key" '.[$k].url' | sed 's|.*/||')
            blockmap_size=$(blockmap_size_for "$first_file")
            {
              echo "version: $VERSION"
              echo "path: $first_file"
              echo "sha512: $(echo "$PLATFORMS" | jq -r --arg k "$first_key" '.[$k].signature')"
              echo "releaseDate: $PUB_DATE"
              if [ -n "$blockmap_size" ]; then
                echo "blockMapSize: $blockmap_size"
              fi
              echo "files:"
              while IFS= read -r k; do
                fname=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].url' | sed 's|.*/||')
                sig=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].signature')
                size=$(echo "$PLATFORMS" | jq -r --arg k "$k" '.[$k].size')
                echo "  - url: $fname"
                echo "    sha512: $sig"
                echo "    size: $size"
                bms=$(blockmap_size_for "$fname")
                if [ -n "$bms" ]; then
                  echo "    blockMapSize: $bms"
                fi
              done < <(echo "$PLATFORMS" | jq -r --argjson keys "$keys" '$keys[] as $k | select(.[$k] != null) | $k')
            } > "${ASSETS_DIR}/${channel}.yml"
            echo "  Generated ${channel}.yml (primary: $first_file)"
          }
          DARWIN_KEYS='["darwin-aarch64-zip","darwin-x86_64-zip","darwin-aarch64","darwin-x86_64"]'
          LINUX_KEYS='["linux-x86_64-appimage","linux-aarch64-appimage","linux-x86_64","linux-aarch64","linux-x86_64-deb","linux-aarch64-deb","linux-x86_64-rpm","linux-aarch64-rpm"]'
          LINUX_ARM64_KEYS='["linux-aarch64-appimage","linux-aarch64","linux-aarch64-deb","linux-aarch64-rpm"]'
          LINUX_X64_KEYS='["linux-x86_64-appimage","linux-x86_64","linux-x86_64-deb","linux-x86_64-rpm"]'
          WIN_KEYS='["windows-x86_64","windows-x86_64-nsis","windows-x86_64-msi"]'
          gen_yml "latest-mac" "$DARWIN_KEYS"
          gen_yml "latest-linux" "$LINUX_KEYS"
          gen_yml "latest-linux-arm64" "$LINUX_ARM64_KEYS"
          gen_yml "latest-linux-x64" "$LINUX_X64_KEYS"
          gen_yml "latest" "$WIN_KEYS"
          echo "==> Platform yml written to ${ASSETS_DIR}"

          YML_URLS=$(jq -n \
            --arg darwin "${S3_URL_PREFIX}/latest-mac.yml" \
            --arg linux "${S3_URL_PREFIX}/latest-linux.yml" \
            --arg win "${S3_URL_PREFIX}/latest.yml" \
            '{darwin: $darwin, linux: $linux, win: $win}')

          LATEST_JSON=$(jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            --argjson yml "$YML_URLS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms, yml: $yml}')
          echo "$LATEST_JSON" > /tmp/latest.json
          cp /tmp/latest.json "${ASSETS_DIR}/latest.json"
          echo "==> Generated latest.json"
          echo "$LATEST_JSON" | jq .

      - name: Verify source identity and final release metadata
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          node scripts/release-provenance.mjs verify "$RELEASE_TAG" /tmp/release-assets "$RELEASE_CHANNEL"
          VERSION="${RELEASE_TAG#*-v}"
          if [ "$RELEASE_CHANNEL" = stable ]; then
            EXPECTED_WIN="Nuwax.Setup.${VERSION}.exe"
            sudo apt-get update -qq
            sudo apt-get install -y -qq osslsigncode
            osslsigncode verify -in "/tmp/release-assets/${EXPECTED_WIN}"
          else
            EXPECTED_WIN="Nuwax-Setup-${VERSION}-unsigned.exe"
          fi
          jq -e --arg filename "$EXPECTED_WIN" \
            '.platforms["windows-x86_64"].url | endswith("/" + $filename)' \
            /tmp/release-assets/latest.json >/dev/null
          grep -Fx "path: ${EXPECTED_WIN}" /tmp/release-assets/latest.yml >/dev/null || {
            echo "::error::Windows 更新元数据未指向 ${RELEASE_CHANNEL} 安装包 ${EXPECTED_WIN}"
            exit 1
          }
          gh release upload "$RELEASE_TAG" /tmp/release-assets/*.yml /tmp/release-assets/latest.json \
            /tmp/release-assets/release-provenance.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload full release to MinIO S3 (installers, yml, latest.json)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [[ "$TAG" == prerelease-v* ]] || [ "$CHANNEL" = "beta" ]; then
            S3_PREFIX="${RELEASE_ROOT}/beta-build/${TAG}"
          else
            S3_PREFIX="${RELEASE_ROOT}/${TAG}"
          fi

          echo "==> MinIO: (1/3) installers and other non-yml release assets"
          for file in /tmp/release-assets/*; do
            [ -f "$file" ] || continue
            case "$(basename "$file")" in *.yml|latest.json) continue ;; esac
            filename=$(basename "$file")
            echo "Uploading to S3: ${filename}"
            aws s3 cp "$file" "s3://${S3_BUCKET}/${S3_PREFIX}/${filename}" \
              --endpoint-url "$S3_ENDPOINT"
          done

          echo "==> MinIO: (2/3) platform yml"
          shopt -s nullglob
          for file in /tmp/release-assets/*.yml; do
            filename=$(basename "$file")
            echo "Uploading to S3: ${filename}"
            aws s3 cp "$file" "s3://${S3_BUCKET}/${S3_PREFIX}/${filename}" \
              --endpoint-url "$S3_ENDPOINT"
          done
          shopt -u nullglob

          echo "==> MinIO: (3/3) versioned latest.json"
          aws s3 cp /tmp/latest.json "s3://${S3_BUCKET}/${S3_PREFIX}/latest.json" \
            --endpoint-url "$S3_ENDPOINT"

      - name: Verify S3 upload
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "beta" ]; then
            VERIFY_URL="${S3_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}/latest-mac.yml"
          else
            VERIFY_URL="${S3_CDN_BASE}/${RELEASE_ROOT}/${TAG}/latest-mac.yml"
          fi
          # MinIO 刚写入的对象可能短暂不可读（v1.0.36 首跑实证：curl -f 静默
          # exit 1 致整步失败且无任何错误输出），带重试循环 + 显式报错。
          for i in 1 2 3 4 5 6; do
            if curl -fsSL --connect-timeout 10 -o /dev/null "$VERIFY_URL"; then
              echo "==> Verify URL 可达（第 $i 次尝试）"
              break
            fi
            if [ "$i" = "6" ]; then
              echo "::error::Verify URL 持续不可达: $VERIFY_URL"
              exit 1
            fi
            echo "Attempt $i: Verify URL 暂不可达，5s 后重试"
            sleep 5
          done
          if [ "$CHANNEL" = beta ]; then
            S3_PREFIX="${RELEASE_ROOT}/beta-build/${TAG}"
          else
            S3_PREFIX="${RELEASE_ROOT}/${TAG}"
          fi
          for file in /tmp/release-assets/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            case "$name" in
              build-manifest-*.json|release-provenance.json)
                expected="$(sha256sum "$file" | cut -d' ' -f1)" ;;
              *)
                expected="$(jq -r --arg name "$name" '.assets[$name] // empty' /tmp/release-assets/release-provenance.json)"
                [ -n "$expected" ] || { echo "::error::来源清单缺少资产: $name"; exit 1; } ;;
            esac
            actual="$(aws s3 cp "s3://${S3_BUCKET}/${S3_PREFIX}/${name}" - \
              --endpoint-url "$S3_ENDPOINT" --quiet | sha256sum | cut -d' ' -f1)" \
              || { echo "::error::S3 读取失败: $name"; exit 1; }
            [ "$actual" = "$expected" ] || { echo "::error::S3 资产 SHA256 不一致: $name"; exit 1; }
          done
          echo "==> S3 versioned assets verified"

      - name: Upload platform yml and latest.json to Alibaba OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "beta" ]; then
            OSS_VERSION_PREFIX="${OSS_BUCKET}/${RELEASE_ROOT}/beta-build/${TAG}"
          else
            OSS_VERSION_PREFIX="${OSS_BUCKET}/${RELEASE_ROOT}/${TAG}"
          fi
          echo "==> Publishing yml + latest.json to OSS (no installers) for channel: ${CHANNEL}"

          shopt -s nullglob
          for file in /tmp/release-assets/*.yml; do
            filename=$(basename "$file")
            echo "Uploading to OSS: ${filename}"
            ossutil cp --force "$file" "${OSS_VERSION_PREFIX}/${filename}" \
              --endpoint "$OSS_ENDPOINT" \
              --region "$OSS_REGION" \
              --access-key-id "$OSS_ACCESS_KEY_ID" \
              --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          done
          shopt -u nullglob

          ossutil cp --force /tmp/latest.json "${OSS_VERSION_PREFIX}/latest.json" \
            --endpoint "$OSS_ENDPOINT" \
            --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" \
            --access-key-secret "$OSS_ACCESS_KEY_SECRET"

      - name: Verify versioned OSS metadata
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          CHANNEL="${RELEASE_CHANNEL}"
          if [ "$CHANNEL" = "stable" ]; then
            VERIFY_PREFIX="${OSS_CDN_BASE}/${RELEASE_ROOT}/${TAG}"
          else
            VERIFY_PREFIX="${OSS_CDN_BASE}/${RELEASE_ROOT}/beta-build/${TAG}"
          fi
          for file in /tmp/release-assets/*.yml /tmp/release-assets/latest.json; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            expected="$(jq -r --arg name "$name" '.assets[$name] // empty' /tmp/release-assets/release-provenance.json)"
            [ -n "$expected" ] || { echo "::error::来源清单缺少 OSS 元数据: $name"; exit 1; }
            actual="$(curl -fsSL --retry 3 "${VERIFY_PREFIX}/${name}" | sha256sum | cut -d' ' -f1)"
            [ "$actual" = "$expected" ] || { echo "::error::OSS 元数据 SHA256 不一致: $name"; exit 1; }
          done
          echo "==> OSS versioned metadata verified"

      - name: Publish channel pointers after all checks
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          if [ "$RELEASE_CHANNEL" = stable ]; then POINTER=latest; else POINTER=beta; fi
          S3_POINTER="s3://${S3_BUCKET}/${RELEASE_ROOT}/${POINTER}/latest.json"
          OSS_POINTER="${OSS_BUCKET}/${RELEASE_ROOT}/${POINTER}/latest.json"
          S3_PREVIOUS=0
          OSS_PREVIOUS=0
          S3_TOUCHED=0
          OSS_TOUCHED=0
          if aws s3 cp "$S3_POINTER" /tmp/previous-s3-pointer.json --endpoint-url "$S3_ENDPOINT" 2>/tmp/s3-backup-error; then
            S3_PREVIOUS=1
          elif ! grep -Eiq '404|NoSuchKey|not found' /tmp/s3-backup-error; then
            cat /tmp/s3-backup-error >&2
            exit 1
          fi
          if ossutil cp --force "$OSS_POINTER" /tmp/previous-oss-pointer.json \
            --endpoint "$OSS_ENDPOINT" --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET" 2>/tmp/oss-backup-error; then
            OSS_PREVIOUS=1
          elif ! grep -Eiq '404|NoSuchKey|not found' /tmp/oss-backup-error; then
            cat /tmp/oss-backup-error >&2
            exit 1
          fi
          rollback() {
            status=$?
            [ "$status" -ne 0 ] || status=1
            trap - ERR INT TERM
            set +e
            if [ "$S3_TOUCHED" = 1 ]; then
              if [ "$S3_PREVIOUS" = 1 ]; then
                aws s3 cp /tmp/previous-s3-pointer.json "$S3_POINTER" --endpoint-url "$S3_ENDPOINT"
              else
                aws s3 rm "$S3_POINTER" --endpoint-url "$S3_ENDPOINT"
              fi
            fi
            if [ "$OSS_TOUCHED" = 1 ]; then
              if [ "$OSS_PREVIOUS" = 1 ]; then
                ossutil cp --force /tmp/previous-oss-pointer.json "$OSS_POINTER" \
                  --endpoint "$OSS_ENDPOINT" --region "$OSS_REGION" \
                  --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET"
              else
                ossutil rm --force "$OSS_POINTER" --endpoint "$OSS_ENDPOINT" --region "$OSS_REGION" \
                  --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET"
              fi
            fi
            exit "$status"
          }
          trap rollback ERR INT TERM
          S3_TOUCHED=1
          aws s3 cp /tmp/latest.json "$S3_POINTER" --endpoint-url "$S3_ENDPOINT"
          OSS_TOUCHED=1
          ossutil cp --force /tmp/latest.json "$OSS_POINTER" \
            --endpoint "$OSS_ENDPOINT" --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          aws s3 cp "$S3_POINTER" /tmp/current-s3-pointer.json --endpoint-url "$S3_ENDPOINT"
          ossutil cp --force "$OSS_POINTER" /tmp/current-oss-pointer.json \
            --endpoint "$OSS_ENDPOINT" --region "$OSS_REGION" \
            --access-key-id "$OSS_ACCESS_KEY_ID" --access-key-secret "$OSS_ACCESS_KEY_SECRET"
          cmp /tmp/latest.json /tmp/current-s3-pointer.json
          cmp /tmp/latest.json /tmp/current-oss-pointer.json
          if [ "$RELEASE_CHANNEL" = beta ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi
          trap - ERR INT TERM
          echo "==> ${RELEASE_CHANNEL} pointer published to S3 and OSS"
