packages:
  - 'crates/agent-electron-client'
  # agent-kit is built locally and installed via file: to keep ASAR dependencies self-contained.
  - '!crates/agent-kit'

# pnpm 11+：非交互环境（含 git hook）下跳过 node_modules 清理确认
confirmModulesPurge: false

allowBuilds:
  '@nuwax-ai/nuwax-harness': true
  # better-sqlite3 13 由 rebuild:better-sqlite3 用仓库锁定的 node-gyp 从源码构建；
  # 它自带的安装脚本只做空配置，而 pnpm 自带的旧 node-gyp 在 Windows 构建机上认不出 Visual Studio。
  better-sqlite3: false
  electron: true
  esbuild: true
  protobufjs: true
  sharp: true
