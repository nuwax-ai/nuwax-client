packages:
  - 'crates/agent-electron-client'
  # agent-kit is built locally and installed via file: to keep ASAR dependencies self-contained.
  - '!crates/agent-kit'

# pnpm 11+：非交互环境（含 git hook）下跳过 node_modules 清理确认
confirmModulesPurge: false

allowBuilds:
  '@nuwax-ai/nuwax-harness': true
  better-sqlite3: true
  electron: true
  esbuild: true
  protobufjs: true
  sharp: true
