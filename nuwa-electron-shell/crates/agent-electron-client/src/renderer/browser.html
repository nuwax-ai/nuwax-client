<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'self'"
    />
    <title>Nuwax</title>
  </head>
  <body>
    <header id="toolbar">
      <nav id="navigation" hidden>
        <button id="back">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12H5m7-7-7 7 7 7" />
          </svg></button
        ><button id="forward">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14m-7-7 7 7-7 7" />
          </svg></button
        >
      </nav>
      <div id="tabs" role="tablist">
      <div id="pageIdentity" role="presentation">
        <button id="location" role="tab" aria-selected="true" aria-controls="address" aria-expanded="false">
          <svg id="pageIcon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18" />
          </svg>
          <strong id="title"></strong>
        </button>
        <button id="reload">
          <svg id="reloadIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.9 1 6.7 2.6L21 8M21 3v5h-5" />
          </svg>
          <svg id="stopIcon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <rect x="6" y="6" width="12" height="12" rx="1" />
          </svg>
        </button>
        <button id="menu" aria-haspopup="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M7.5 12h.01M12 12h.01M16.5 12h.01" />
          </svg>
        </button>
        <button id="closeTab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M7 17 17 7" /></svg>
        </button>
      </div>
      </div>
      <div id="toolbarSpace"></div>
      <div id="feedback" role="status" aria-live="polite" aria-atomic="true" hidden>
        <svg id="feedbackSuccess" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m5 12 4 4L19 6" />
        </svg>
        <span id="feedbackText"></span>
      </div>
      <div id="pageActions">
        <button id="search" aria-controls="findbar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="7" />
            <path d="m16 16 5 5" />
          </svg>
        </button>
        <span class="actionDivider" aria-hidden="true"></span>
        <button id="copyLink">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="8" width="12" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
        <button id="pin" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 3h8l-2 5v3l3 3v2H7v-2l3-3V8zm4 13v6" />
          </svg>
        </button>
      </div>
      <div id="windowControls" hidden>
        <button id="minimize">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 12h12" />
          </svg>
        </button>
        <button id="maximize">
          <svg id="maximizeIcon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" />
          </svg>
          <svg id="restoreIcon" viewBox="0 0 24 24" aria-hidden="true" hidden>
            <path d="M9 9V5h10v10h-4" />
            <rect x="5" y="9" width="10" height="10" />
          </svg>
        </button>
        <button id="closeWindow">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M6 18 18 6" />
          </svg>
        </button>
      </div>
    </header>
    <div id="address" hidden>
      <label id="urlLabel" class="sr-only" for="url"></label>
      <span id="domain"></span>
      <input id="url" readonly /><button id="closeAddress">×</button>
    </div>
    <div id="findbar" hidden>
      <input id="query" type="search" /><span id="matches" role="status"></span
      ><button id="previous">↑</button><button id="next">↓</button
      ><button id="closefind">×</button>
    </div>
    <section id="loadingState" hidden role="status">
      <span id="loadingText"></span>
    </section>
    <section id="error" hidden role="alert">
      <p id="errorMessage"></p>
      <button id="retry"></button><button id="external"></button
      ><button id="copy"></button>
    </section>
    <script type="module" src="/features/browser/toolbar.ts"></script>
  </body>
</html>
